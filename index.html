  const netSaved = () => { try { const sv = JSON.parse(localStorage.getItem('hexaria.net') || 'null'); return sv && sv.mode === 'srv' && sv.code ? sv : null; } catch (e) { return null; } };
  const netForget = () => { try { localStorage.removeItem('hexaria.net'); } catch (e) {} };
  const SRV_DEFAULT = 'https://hexaria-server.leonardoxabi.workers.dev';
  const srvUrl = () => { let u = ''; try { u = localStorage.getItem('hexaria.server') || ''; } catch (e) {} return (u || SRV_DEFAULT).replace(/\/+$/, ''); };
  const srvCfg = () => ({ players: cfg.players, mode: cfg.mode, difficulty: cfg.difficulty, vp: cfg.vp, theme: cfg.theme });
  async function srvCreate() {
    const nm = $('#netNameHost'); saveName((nm && nm.value.trim()) || 'Anfitrión');
    netLeave(); NET.on = true; NET.mode = 'srv'; netSetStatus('Pidiendo una sala al servidor…');
    let code;
    try { const r = await fetch(srvUrl() + '/new', { cache: 'no-store' }); const j = await r.json(); code = j.code; if (!code) throw new Error(j.error || 'sin código'); }
    catch (e) { netSetStatus('No se llega al servidor (' + srvUrl() + '). Comprueba la dirección o la conexión.'); NET.on = false; return; }
    srvOpen(code, { create: true });
  }
  function srvJoin(code) { netLeave(); NET.on = true; NET.mode = 'srv'; const sv = netSaved(); if (sv && sv.code === code.toUpperCase().trim() && sv.name && !NET.name) NET.name = sv.name; srvOpen(code.toUpperCase().trim(), {}); }
  // Abre (o reabre) el WebSocket con la sala. Con keep=true conserva asiento y partida (reconexión)
  function srvOpen(code, { create = false, keep = false } = {}) {
    NET.code = code; NET.name = NET.name || 'Invitado'; NET.host = keep ? NET.host : false;
    if (!keep) { try { const sv = JSON.parse(localStorage.getItem('hexaria.net') || 'null'); if (sv && sv.code === code && sv.mode === 'srv') { NET.seated = true; NET.mySeat = sv.seat; } } catch (e) {} }
    if (NET.ws) { const w = NET.ws; NET.ws = null; try { w.onclose = null; w.close(); } catch (e) {} }
    if (!G) netSetStatus(keep ? 'Reconectando con la sala ' + code + '…' : 'Conectando con la sala ' + code + '…'); else toast('Reconectando con el servidor…');
    let ws;
    try { ws = new WebSocket(srvUrl().replace(/^http/, 'ws') + '/r/' + code); } catch (e) { netSetStatus('Dirección del servidor no válida.'); return; }
    NET.ws = ws;
    const srv = { peer: 'server', get open() { return ws.readyState === 1; }, send: m => { if (ws.readyState === 1) ws.send(JSON.stringify(m)); }, close: () => { try { ws.close(); } catch (e) {} } };
    NET.hostConn = srv; NET.conns = { server: srv }; NET.probe = 0;
    netWatch(12000, 'El servidor no responde. Comprueba la conexión o la dirección del servidor.');
    ws.onopen = () => { clearTimeout(netTimer); NET.lastMsg = Date.now(); srv.send({ t: 'hello', name: NET.name, seat: NET.seated ? NET.mySeat : undefined, cfg: create ? srvCfg() : undefined }); };
    ws.onmessage = e => { NET.lastMsg = Date.now(); NET.probe = 0; let m; try { m = JSON.parse(e.data); } catch (x) { return; } srvHandle(m, srv).catch(err => { console.error(err); reportToLog(err); }); };
    ws.onerror = () => {};
    ws.onclose = e => {
      if (!NET.on || NET.ws !== ws) return;
      clearTimeout(netTimer);
      if (e.code === 4000) { toast('Has entrado en la sala desde otro sitio; esta sesión se cierra.', 4000); netLeave(); showMenu(G ? 'main' : 'srv', !!G); return; }
      NET.retries = (NET.retries || 0) + 1;
      if (NET.retries <= 8) { if (!G) netSetStatus('Conexión perdida; reconectando…'); setTimeout(() => { if (NET.on && NET.ws === ws) srvOpen(NET.code, { keep: true }); }, 1500 * Math.min(NET.retries, 4)); return; }
      toast('No se pudo reconectar con el servidor.', 4000); netLeave(); if (G) showMenu('main', true); else showMenu('srv');
    };
  }
  // Un asiento humano se queda sin jugador (lo lleva la máquina hasta que vuelva) o vuelve a ocuparse
  function seatToBot(seat, name) {
    if (!G || G.phase === 'over' || !NET.host) return;
    if (G.players[seat].isBot) return;
    G.players[seat].isBot = true; log(`${who(seat)} se ha desconectado; a partir de ahora juega la máquina por él.`, 'sys warn');
    netEmit({ t: 'sync', G: snap(), ev: [], note: `${G.players[seat].name} se ha desconectado; juega la máquina por él.` });
    if (NET.next && netActor()) { const f = NET.next; NET.next = null; f(); }
  }
  function seatBack(seat, name) {
    if (!G || !NET.host || !G.players[seat].isBot) return;
    G.players[seat].isBot = false; if (name) G.players[seat].name = name;
    log(`${who(seat)} ha vuelto a la partida.`, 'sys');
    netEmit({ t: 'sync', G: snap(), ev: [], note: `${G.players[seat].name} ha vuelto a la partida.` });
  }
  async function srvHandle(msg, srv) {
    if (msg.t === 'pong') return;
    if (msg.t === 'full') { netSetStatus(msg.reason || 'La sala está completa.'); const sv = netSaved(); if (sv && sv.code === NET.code) netForget(); NET.on = false; if (isNetView()) showMenu(menuView); return; }
    if (msg.t === 'seat') { NET.mySeat = msg.seat; NET.seated = true; NET.retries = 0; try { localStorage.setItem('hexaria.net', JSON.stringify({ code: NET.code, seat: msg.seat, name: NET.name, mode: 'srv', at: Date.now() })); } catch (e) {} if (!G) netSetStatus('En la sala. Esperando a que empiece la partida…'); return; }
    if (msg.t === 'lobby') {
      NET.lobby = msg.players.map(p => ({ ...p, peerId: p.seat === NET.mySeat ? 'me' : 'server' }));
      const me = NET.lobby.find(x => x.seat === NET.mySeat); if (me) NET.name = me.name;
      if (msg.cfg && !NET.host) Object.assign(cfg, msg.cfg);
      if (isNetView()) showMenu(menuView); return;
    }
    if (msg.t === 'host') {
      const was = NET.host; NET.host = msg.seat === NET.mySeat;
      if (NET.host !== was) {
        if (NET.host) { hostNotify(); if (!G) netSetStatus(''); if (G && G.phase !== 'over') { log('Ahora haces de anfitrión: la máquina juega desde tu dispositivo.', 'sys'); if (NET.next && netActor()) { const f = NET.next; NET.next = null; f(); } } }
        else hostNotifyClose();
        if (isNetView()) showMenu(menuView);
      }
      return;
    }
    if (msg.t === 'start') { if (!G) startNetGame(msg); else if (msg.resume) netResume(msg); return; }
    if (msg.t === 'sync' || msg.t === 'next') { netQueue(msg); return; }
    if (msg.t === 'ask') { if (!isLocalSeat(msg.to)) return; const result = await netAnswer(msg); srv.send({ t: 'reply', id: msg.id, result }); return; }
    if (msg.t === 'reply') { netResolve(msg); return; }
    if (msg.t === 'left') { seatToBot(msg.seat, msg.name); return; }
    if (msg.t === 'back') { seatBack(msg.seat, msg.name); return; }
  }

  function pwaInit() {
    try {
      // Manifiesto incrustado: funciona aunque el juego sea un solo archivo (las rutas se resuelven contra la página)
      const here = location.href.replace(/[#?].*$/, '');
      const man = { name: 'Tierras de Hexaria', short_name: 'Hexaria', lang: 'es', description: 'Juego de mesa 3D de colonización y comercio.', start_url: here, scope: here.replace(/[^/]*$/, ''), id: here, display: 'standalone', orientation: 'any', background_color: '#120c07', theme_color: '#8d2a1c',
        icons: [{ src: PWA_ICONS.i192, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: PWA_ICONS.i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
      const link = document.createElement('link'); link.rel = 'manifest'; link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man)); document.head.appendChild(link);
    } catch (e) {}
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.prompt = e; if (menuView === 'main') showMenu('main'); });
    addEventListener('appinstalled', () => { PWA.installed = true; PWA.prompt = null; toast('Hexaria instalada en este dispositivo'); if (menuView === 'main') showMenu('main'); });
    // El service worker solo puede registrarse si sw.js está junto a la página y se sirve por https; si no, el juego funciona igual
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('./sw.js').then(r => { PWA.reg = r; }).catch(() => {});
    }
  }
  async function pwaInstall() {
    if (PWA.prompt) { const p = PWA.prompt; PWA.prompt = null; try { await p.prompt(); } catch (e) {} if (menuView === 'main') showMenu('main'); return; }
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    openModal(`${head(View.iconSVG('wood'), 'Instalar Hexaria', 'Como una aplicación más')}
      <p>${ios ? 'En Safari toca el botón <b>Compartir</b> y luego <b>Añadir a pantalla de inicio</b>.' : 'En el menú del navegador (⋮ o ⋯) elige <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>. Si no aparece, abre el juego desde una dirección https.'}</p>
      <div class="row"><button class="btn primary" data-x>Entendido</button></div>`);
  }
  // Mientras se es anfitrión de una partida en marcha queda fijada una notificación con el código y el turno
  function hostNotifyText() {
    if (!G) return `Sala abierta · código ${NET.code} · ${NET.lobby.length} en la mesa`;
    const seat = G.phase === 'setup' ? G.setupOrder[G.setupIdx] : G.cur;
    return `Código ${NET.code} · ${G.phase === 'setup' ? 'colocación de' : 'turno ' + G.turn + ', juega'} ${G.players[seat].name}`;
  }
  async function hostNotify() {
    if (!NET.on || !NET.host || !('Notification' in window)) return;
    if (G && G.phase === 'over') return hostNotifyClose();
    try {
      if (Notification.permission === 'default') await Notification.requestPermission();
      if (Notification.permission !== 'granted') return;
      const opts = { body: hostNotifyText(), tag: 'hexaria-host', renotify: false, requireInteraction: true, silent: true, icon: PWA_ICONS.i192, badge: PWA_ICONS.i192 };
      const reg = PWA.reg || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration().catch(() => null));
      if (reg && reg.showNotification) { await reg.showNotification('Tierras de Hexaria · eres el anfitrión', opts); return; }
      if (PWA.notif) PWA.notif.close();
      PWA.notif = new Notification('Tierras de Hexaria · eres el anfitrión', opts);
      PWA.notif.onclick = () => { window.focus(); };
    } catch (e) {}
  }
  async function hostNotifyClose() {
    try {
      if (PWA.notif) { PWA.notif.close(); PWA.notif = null; }
      const reg = PWA.reg || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration().catch(() => null));
      if (reg && reg.getNotifications) (await reg.getNotifications({ tag: 'hexaria-host' })).forEach(n => n.close());
    } catch (e) {}
  }

          <div class="tabs ribbons">${[3, 4].map(n => `<button class="btn small" data-np="${n}" aria-pressed="${cfg.players === n}">${n} jugadores</button>`).join('')}</div>
          <div class="rivals">${defs.map((d, i) => `<span class="${i >= cfg.players ? 'off' : ''}">${crest(i)}${d.name}</span>`).join('')}</div></div>
        <div class="opt-group"><div class="cap">Extensión</div>
          <p class="hint">Toca una carta para elegir cómo se juega.</p>
          <div class="modecards">${Object.keys(Core.MODES).map(k => `<button class="mcard" data-mode="${k}" aria-pressed="${cfg.mode === k}"><div class="art">${MODE_ART[k]}</div><b>${modeName(k)}</b><i>${MODE_INFO[k].short}</i>${cfg.mode === k ? '<span class="chk">✓</span>' : ''}</button>`).join('')}</div>
          <details class="modeinfo" open><summary>Qué cambia en ${modeName(cfg.mode)}</summary><ul class="rules">${MODE_INFO[cfg.mode].rules.map(r => `<li>${r}</li>`).join('')}</ul></details></div>
        <div class="opt-group"><div class="cap">Dificultad</div>
          <div class="tabs ribbons">${Object.keys(DIFF).map(k => `<button class="btn small" data-diff="${k}" aria-pressed="${cfg.difficulty === k}">${DIFF[k][0]}</button>`).join('')}</div>
          <p class="hint">${DIFF[cfg.difficulty][1]}</p></div>
        <div class="opt-group" style="border-bottom:none"><div class="cap">Puntos de victoria</div>
          <div class="vpstep"><button class="peg" data-vp="-1" ${cfg.vp <= 5 ? 'disabled' : ''} aria-label="Menos puntos">−</button><span class="num">${cfg.vp}</span><button class="peg" data-vp="1" ${cfg.vp >= 15 ? 'disabled' : ''} aria-label="Más puntos">+</button></div>
          <p class="hint">${vpHint}</p></div>
        ${readSave() ? '<p class="hint">Empezar una partida nueva sustituirá a la guardada.</p>' : ''}
        <div class="mcta"><button class="btn primary" data-start>Comenzar partida</button></div>`;
    } else if (view === 'load') {
      const sv = readSave();
      if (!sv) return showMenu('main');
      const g = Core.restore(JSON.parse(JSON.stringify(sv.G)));
      const dt = new Date(sv.savedAt), when = `${dt.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' })}, ${dt.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}`;
      const pl = (n, a, b) => `${n} ${n === 1 ? a : b}`;
      const order = g.players.map(x => ({ x, pts: Core.points(g, x.id, x.id === HUMAN) })).sort((a, b) => b.pts - a.pts);
      const rows = order.map(({ x, pts }, i) => `<li><span class="pos">${i + 1}</span>${View.armsSVG(x.id, x.color)}
          <span><b style="color:${TEXT_COL[x.id]}">${x.name}${x.id === HUMAN ? '' : ''}</b><i>${pl(Core.total(x.res), 'carta', 'cartas')} · ${pl(x.settlements, Lx.settlementL, Lx.settlementsL)} · ${pl(x.cities, Lx.cityL, Lx.citiesL)}</i></span>
          <span class="lpts" title="${pts} puntos">${pts}</span></li>`).join('');
      m.innerHTML = `<button class="back" data-go="main">‹ Menú</button>
        <h2>Partida guardada</h2><p class="smeta">${when} · ${ago(sv.savedAt)} · ${({ future: 'Futurista', pompaelo: 'Pompaelo' })[sv.theme] || 'Medieval'}</p>
        <div class="flourish"></div>
        <dl class="savefacts">
          <div><dt>Fase</dt><dd>${g.phase === 'setup' ? 'Colocación' : `Turno <span class="n">${g.turn}</span>`}</dd></div>
          <div><dt>Dificultad</dt><dd>${DIFF[g.difficulty][0]}</dd></div>
          <div><dt>Extensión</dt><dd>${modeName(g.mode)}</dd></div>
          <div><dt>Meta</dt><dd><span class="n">${g.target}</span> puntos</dd></div>
        </dl>
        <div class="flourish"></div>
        <ol class="standings">${rows}</ol>
        <div class="mcta"><button class="btn primary" data-load>Continuar partida</button>
        <button class="btn danger" data-del>${delArm ? '¿Seguro? Pulsa otra vez para borrar' : 'Borrar partida guardada'}</button></div>`;
    } else if (view === 'ach') {
      m.innerHTML = `<button class="back" data-go="main">‹ Menú</button><h2>Logros</h2><p class="hint" style="text-align:left">${readAch().size} de ${ACHIEVEMENTS.length} conseguidos. Se guardan en este navegador.</p><div class="flourish"></div>${achListHTML()}`;
    } else if (view === 'rules') {
      m.innerHTML = `<button class="back" data-go="main">‹ Menú</button><h2>Cómo se juega</h2><p class="hint" style="text-align:left">${Lx.rulesSub}</p><div class="flourish"></div>${rulesHTML()}
        <div class="flourish"></div><h2>Extensiones</h2>${Object.keys(Core.MODES).filter(k => k !== 'classic').map(k => `<div class="lbl2">${modeName(k)}</div><p class="hint" style="text-align:left">${MODE_INFO[k].short}</p><ul class="rules">${MODE_INFO[k].rules.map(r => `<li>${r}</li>`).join('')}</ul>`).join('')}`;
    } else if (view === 'p2p' || view === 'srv') {
      const srv = view === 'srv', hosting = NET.on && NET.host, joined = NET.on && !NET.host;
      const lobby = NET.lobby.length ? `<div class="lbl2">Jugadores</div><ol class="standings">${NET.lobby.map(l => `<li><span class="pos">${l.seat + 1}</span>${View.armsSVG(l.seat, Core.PLAYER_DEFS[l.seat].color)}<span><b style="color:${TEXT_COL[l.seat]}">${l.name}</b><i>${srv ? (l.seat === (NET.lobby.find(x => x.online !== false) || {}).seat && NET.on ? 'anfitrión' : 'jugador') : (l.seat === 0 ? 'anfitrión' : 'invitado')}${l.seat === NET.mySeat ? ' · tú' : ''}${l.online === false ? ' · desconectado' : ''}</i></span></li>`).join('')}${Array.from({ length: Math.max(0, cfg.players - NET.lobby.length) }, (_, i) => `<li><span class="pos">${NET.lobby.length + i + 1}</span><span><b>Máquina</b><i>asiento libre</i></span></li>`).join('')}</ol>` : '';
      m.innerHTML = `<button class="back" data-go="main">‹ Menú</button>
        ${(() => { if (!srv || NET.on) return ''; try { const sv = JSON.parse(localStorage.getItem('hexaria.net') || 'null'); return sv && sv.mode === 'srv' ? `<div class="opt-group"><p class="hint">Tenías una partida en la sala <b>${sv.code}</b>${sv.name ? ' como <b>' + sv.name + '</b>' : ''}.</p><div class="row" style="justify-content:center"><button class="btn primary" data-srvback="${sv.code}">Volver a la partida</button></div></div>` : ''; } catch (e) { return ''; } })()}
        <h2>${srv ? 'Multijugador' : 'Entre amigos'}</h2><p class="hint" style="text-align:left">${srv ? 'Salas alojadas en el servidor: la partida se guarda, se puede volver a ella y si el anfitrión se va, otro jugador toma el relevo.' : 'Conexión directa entre navegadores (P2P). Prueba: el anfitrión crea un código y los demás se unen con él.'}</p>
        <div class="flourish"></div>
        ${NET.on ? `<div class="opt-group"><div class="cap">Tu nombre</div><div class="row" style="justify-content:center"><input class="field" id="netName" maxlength="14" placeholder="Cómo te verán los demás" value="${(NET.name || '').replace(/"/g, '&quot;')}" style="width:200px"><button class="btn" data-netrename>Cambiar</button></div></div>` : ''}
        ${hosting ? `<div class="opt-group"><div class="cap">Código de la partida</div><div class="code">${NET.code}</div><p class="hint">Compártelo con tus amigos. ${NET.status || 'Esperando a que se unan…'}</p>
          <p class="hint">${cfg.players} jugadores · ${modeName(cfg.mode)} · ${DIFF[cfg.difficulty][0]} · ${cfg.vp} puntos. Los asientos libres los juega la máquina.</p></div>${lobby}
          <p class="hint diag" id="netDiag">${netDiag()}</p>
          <div class="mcta"><button class="btn primary" data-netstart ${NET.lobby.length > 1 ? '' : 'disabled'}>Comenzar partida</button><button class="btn" data-netleave>Cancelar</button></div>`
        : joined ? `<div class="opt-group"><div class="cap">Código</div><div class="code">${NET.code}</div><p class="hint">${NET.status || 'Conectado.'}</p></div>${lobby}
          <p class="hint diag" id="netDiag">${netDiag()}</p>
          <div class="mcta"><button class="btn" data-netleave>Salir</button></div>`
        : `<div class="opt-group"><div class="cap">Crear partida</div><p class="hint">Se usarán los ajustes de la partida individual: ${cfg.players} jugadores, ${modeName(cfg.mode)}, ${DIFF[cfg.difficulty][0]}, ${cfg.vp} puntos.</p>
            <label class="flabel">Tu nombre<input class="field" id="netNameHost" maxlength="14" placeholder="Cómo te verán los demás" value="${(NET.name || '').replace(/"/g, '&quot;')}"></label>
            <div class="row" style="justify-content:center"><button class="btn primary" data-nethost>Crear y obtener código</button></div></div>
          <div class="opt-group" style="border-bottom:none"><div class="cap">Unirse a una partida</div>
            <label class="flabel">Tu nombre<input class="field" id="netNameJoin" maxlength="14" placeholder="Cómo te verán los demás" value="${(NET.name || '').replace(/"/g, '&quot;')}"></label>
            <label class="flabel">Código de la partida<div class="row" style="justify-content:flex-start;margin-top:4px"><input class="field code-in" id="netCode" maxlength="5" placeholder="CÓDIGO" style="text-transform:uppercase" value="${NET.code || ''}"><button class="btn primary" data-netjoin>Unirse</button></div></label>
            ${NET.status ? `<p class="hint">${NET.status}</p>` : ''}</div>
          ${srv ? `<details class="modeinfo"><summary>Dirección del servidor</summary><div class="row" style="justify-content:flex-start;margin-top:6px"><input class="field" id="srvUrl" value="${srvUrl().replace(/"/g, '&quot;')}" style="flex:1;min-width:0"><button class="btn small" data-srvsave>Guardar</button></div><p class="hint" style="text-align:left">Servidor propio en Cloudflare (plan gratuito). Déjalo como está salvo que uses otro.</p></details>
          <p class="hint" style="text-align:left">La sala se guarda en el servidor hasta 36 h sin actividad; cualquiera puede volver a entrar con el código y recupera su asiento. Si el anfitrión se va, el servidor nombra a otro jugador conectado.</p>` : `<p class="hint" style="text-align:left">Requisitos: internet para el apretón de manos (servidor público de PeerJS) y que la red permita WebRTC; si no hay camino directo se usa un relé público (más lento). Abre el juego desde la dirección web o la app instalada, no desde un visor incrustado. Si el anfitrión cierra la pestaña, la partida termina.</p>`}`}`;
    } else {
      m.innerHTML = `<button class="back" data-go="main">‹ Menú</button>
        <h2>Multijugador</h2><p class="hint" style="text-align:left">Elige cómo quieres jugar con otras personas.</p>
        <div class="flourish"></div>
        <nav class="mnav">
          <button class="mitem" data-go="p2p"><span class="crest trio">${crest(1)}${crest(2)}</span><span><b>Entre amigos (P2P)</b><i>Un código, sin servidor. Versión de prueba.</i></span><span class="chev">›</span></button>
          <button class="mitem" data-go="srv"><span class="crest">${crest(3)}</span><span><b>Servidor</b><i>Salas que no dependen del anfitrión: la partida sigue aunque alguien cierre</i></span><span class="chev">›</span></button>
        </nav>`;
    }
    m.scrollTop = keep; menuView = view;
    $('#menu').hidden = false;
    if (wasHidden || fresh) View.setAttract(true, menuLayout());   // la cámara solo se recoloca al entrar al menú
  }
  // Desplaza el centro de la vista 3D al hueco que deja el pergamino
  function menuLayout() {
    const w = innerWidth, h = innerHeight;
    if (w <= 720) { const sh = h * 0.28; return { y: h / 2 - sh / 2, zoom: Math.max(1, (h / sh) * 0.62) }; }
    const pw = Math.min(440, Math.max(340, w * 0.3)); return { x: -pw / 2, zoom: Math.max(1, w / (w - pw) * 0.95) };
  }
  function onMenuClick(e) {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.go) { delArm = false; return showMenu(d.go); }
    if ('load' in d) { loadGame(); return; }
    if ('install' in d) { pwaInstall(); return; }
    if (d.srvback) { if (menuView !== 'srv') showMenu('srv'); srvJoin(d.srvback); return; }
    if ('srvsave' in d) { const u = $('#srvUrl'); try { localStorage.setItem('hexaria.server', (u && u.value.trim()) || ''); } catch (e) {} toast('Dirección guardada'); return; }
    if ('nethost' in d && menuView === 'srv') { srvCreate(); return; }
    if ('nethost' in d) { const nm = $('#netNameHost'); saveName((nm && nm.value.trim()) || 'Anfitrión'); netHost().then(() => showMenu('p2p')).catch(e => { netSetStatus(e.message); }); return; }
    if ('netjoin' in d) { const nm = $('#netNameJoin'), cd = $('#netCode'); if (!nm || !nm.value.trim()) { toast('Escribe tu nombre.'); nm && nm.focus(); return; } saveName(nm.value.trim()); if (!cd || cd.value.trim().length < 5) { toast('Escribe el código de 5 caracteres.'); cd && cd.focus(); return; } if (menuView === 'srv') { srvJoin(cd.value); return; } netJoin(cd.value).then(() => showMenu('p2p')).catch(e => { netSetStatus(e.message); }); return; }
    if ('netrename' in d) { const nm = $('#netName'); const name = (nm && nm.value.trim().slice(0, 14)); if (!name) { toast('Escribe un nombre.'); return; } saveName(name); netRename(name); return; }
    if ('netleave' in d) { const v = menuView === 'srv' ? 'srv' : 'p2p'; try { localStorage.removeItem('hexaria.net'); } catch (e) {} netLeave(); return showMenu(v); }
    if ('netstart' in d) { netStart(); return; }
    if (d.theme) {
      if (d.theme !== cfg.theme) {
        applyTheme(d.theme);
        try { localStorage.setItem('hexaria.cfg', JSON.stringify(cfg)); } catch (err) {}
        View.buildBoard(Core.newGame({ mode: cfg.mode }).board, Core.PLAYER_DEFS);
        View.setAttract(true, menuLayout());
      }
      return showMenu(menuView || 'main');
    }
    if ('del' in d) { if (!delArm) { delArm = true; return showMenu('load'); } delArm = false; clearSave(); toast('Partida guardada borrada.'); return showMenu('main'); }
    if (d.np) cfg.players = +d.np;
    else if (d.mode) { if (d.mode !== cfg.mode) { cfg.mode = Core.MODES[d.mode] ? d.mode : 'classic'; View.buildBoard(Core.newGame({ mode: cfg.mode }).board, Core.PLAYER_DEFS); } }   // la mesa del fondo muestra el mapa de la extensión
    else if (d.diff) cfg.difficulty = d.diff;
    else if (d.vp) cfg.vp = Math.max(5, Math.min(15, cfg.vp + +d.vp));
    else if ('start' in d) { try { localStorage.setItem('hexaria.cfg', JSON.stringify(cfg)); } catch (err) {} startNewGame(); return; }
    showMenu('solo');
  }
  function loadGame() {
    const d = readSave(); if (!d) { toast('No hay ninguna partida guardada.'); return; }
    menuView = null;
    applyTheme(d.theme || 'medieval');
    G = Core.restore(d.G); lastSnap = d;
    cfg = { players: G.players.length, vp: G.target, difficulty: G.difficulty, theme: d.theme || 'medieval', mode: G.mode || 'classic' };
    $('#menu').hidden = true; document.body.classList.remove('in-menu'); View.setAttract(false);
    busy = false; endTurn = null; lastLongest = G.longestOwner; lastArmy = G.armyOwner; lastHarbor = G.harborOwner; lastHand = null; lastVP = null;
    View.clearTargets(); closeModal(); setBanner(null);
    rebuildBoard();
    const list = $('#logList'); list.innerHTML = '';
    (d.log || []).forEach(([c, h]) => { const li = document.createElement('li'); li.className = c; li.innerHTML = h; list.appendChild(li); });
    log(`Partida reanudada (guardada ${ago(d.savedAt)}).`, 'sys');
    renderHUD();
    stamp('Partida reanudada', `Turno ${G.turn || 1} · ${G.players[G.cur].name} tiene la palabra`);
    mainLoop(true).catch(e => { if (e !== ABORT) console.error(e); });
  }
  // Vuelve a montar el tablero y recoloca todas las piezas (al cargar y al descubrir casillas)
  function rebuildBoard() {
    View.buildBoard(G.board, G.players);
    G.board.edges.forEach(e => { if (e.road < 0) return; if (e.kind === 'ship') View.addShip(e.id, e.road, false); else View.addRoad(e.id, e.road, false); });
    G.board.verts.forEach(v => { if (!v.building) return; if (v.building.type === 'city') View.upgradeCity(v.id, v.building.owner, false); else View.addSettlement(v.id, v.building.owner, false); });
    View.setRaids(G.barb ? G.barb.raided : []);
  }
  function startNewGame() {
    menuView = null;
    G = Core.newGame(cfg);
    $('#menu').hidden = true; document.body.classList.remove('in-menu'); View.setAttract(false);
    busy = false; endTurn = null; lastLongest = -1; lastArmy = -1; lastHarbor = -1; lastHand = null; lastVP = null;
    View.clearTargets(); closeModal(); setBanner(null);
    $('#logList').innerHTML = '';
    View.buildBoard(G.board, G.players);
    log(`Nuevo mapa de ${Lx.title}${G.mode !== 'classic' ? ' (' + modeName(G.mode) + ')' : ''}: ${G.players.length} jugadores, dificultad ${DIFF[G.difficulty][0]}, victoria con ${G.target} puntos. Empieza colocando ${who(G.setupOrder[0])}; la colocación sigue en serpiente.`, 'sys');
    renderHUD();
    mainLoop().catch(e => { if (e !== ABORT) console.error(e); });
  }

  /* ---------- eventos de interfaz ---------- */
  function bindUI() {
    $('#actions').addEventListener('click', e => {
      const b = e.target.closest('button[data-act]'); if (!b || b.disabled) return;
      const a = b.dataset.act;
      if (a === 'roll') onRoll(); else if (a === 'end') onEnd(); else if (a === 'trade') onTrade(); else if (a === 'dev') onBuyDev(); else if (a === 'lair') onLair(); else if (a === 'fight') onFight(); else onBuild(a);
    });
    $('#hand').addEventListener('click', e => { const b = e.target.closest('button[data-dev]'); if (b && !b.disabled) onPlayDev(b.dataset.dev); });
    $('#btnHelp').onclick = helpDialog;
    $('#btnLog').onclick = () => {
      const l = $('#log');
      if (matchMedia('(max-width: 860px), (max-height: 520px) and (orientation: landscape)').matches) l.classList.toggle('open'); else l.hidden = !l.hidden;
    };
    addEventListener('keydown', e => {
      if (!$('#modal').hidden || e.target.tagName === 'INPUT') return;
      const k = e.key.toLowerCase();
      if (k === 'r') onRoll();
      else if (k === 'e') onEnd();
      else if (k === 'escape' && bannerCancel) $('#bCancel').click();
    });
  }

  // Cualquier error inesperado queda anotado en la crónica para poder localizarlo
  let errShown = 0;
  function reportToLog(e) {
    const msg = (e && (e.message || String(e))) || 'error desconocido';
    if (errShown++ < 5) { log(`Error: ${msg}`, 'sys warn'); toast('Se ha producido un error. Está anotado en la crónica.', 3500); }
  }
  addEventListener('error', ev => { if (ev.error !== ABORT) reportToLog(ev.error || ev.message); });
  addEventListener('unhandledrejection', ev => { if (ev.reason !== ABORT) reportToLog(ev.reason); });
  async function boot() {
    try {
      if (!window.THREE || !window.CANNON || !THREE.OrbitControls || !THREE.BufferGeometryUtils) throw new Error('No se pudieron cargar las librerías 3D. Comprueba la conexión y recarga la página.');
      const fonts = document.fonts ? Promise.all([document.fonts.load('400 100px "IM Fell English SC"'), document.fonts.load('400 16px "EB Garamond"'), document.fonts.load('italic 400 16px "EB Garamond"'), document.fonts.load('700 100px "Cinzel"', '0123456789'), document.fonts.load('400 30px "Cinzel"', '0123456789'), document.fonts.load('700 100px "Oxanium"'), document.fonts.load('600 16px "Chakra Petch"')]) : Promise.resolve();
      await Promise.race([fonts.catch(() => {}), sleep(2500)]);
      View.init($('#c'));
      View.onError(reportToLog);
      applyTheme(cfg.theme);
      $('#loadMsg').textContent = Lx.loading;
      // Bordes rasgados del pergamino de las ventanas
      const j = () => (1 + Math.random() * 5).toFixed(1), N = 30, pts = [];
      for (let i = 0; i <= N; i++) pts.push(`${(i / N * 100).toFixed(2)}% ${j()}px`);
      for (let i = 0; i <= N; i++) pts.push(`calc(100% - ${j()}px) ${(i / N * 100).toFixed(2)}%`);
      for (let i = N; i >= 0; i--) pts.push(`${(i / N * 100).toFixed(2)}% calc(100% - ${j()}px)`);
      for (let i = N; i >= 0; i--) pts.push(`${j()}px ${(i / N * 100).toFixed(2)}%`);
      document.documentElement.style.setProperty('--deckle', `polygon(${pts.join(',')})`);
      bindUI(); pwaInit();
      const top = $('#top'), setTop = () => document.documentElement.style.setProperty('--topH', Math.round(top.getBoundingClientRect().bottom) + 'px');
      setTop(); if (window.ResizeObserver) new ResizeObserver(setTop).observe(top); addEventListener('resize', setTop);
      $('#menuSheet').addEventListener('click', onMenuClick);
      addEventListener('resize', () => { if (!$('#menu').hidden) View.setAttract(true, menuLayout()); });
      showMenu('main', true);
      setTimeout(() => $('#loading').classList.add('done'), 150);
    } catch (e) {
      $('#loadMsg').innerHTML = `<span class="err">${e.message || 'Tu navegador no admite WebGL.'}</span>`;
    }
  }
  boot();
  return {};
})();
</script>
