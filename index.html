<style>
/* Mesa de un señor feudal a la luz de las velas: escena 3D a pantalla completa; HUD de pergamino entintado con sellos de lacre */
:root{
  --parch: rgba(233,219,186,.94);
  --parch-solid: #e9dbba;
  --parch-dk: #d9c49a;
  --ink: #2c2016;
  --ink-2: #5b4733;
  --rule: rgba(92,62,32,.48);
  --seal: #8d2a1c;
  --seal-hi: #a83a29;
  --gold: #9b7128;
  --good: #3f6e33;
  --bad: #9a2a1c;
  --display: "Cinzel", "IM Fell English SC", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --body: "EB Garamond", "Palatino Linotype", Georgia, serif;
  --italic: "EB Garamond", "Palatino Linotype", Georgia, serif;
  --num: "Cinzel", "Trajan Pro", Georgia, serif;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36 0 0 0 0 .23 0 0 0 0 .1 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:#120c07;color:var(--ink);font:16px/1.3 var(--body);font-variant-numeric:lining-nums;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 45%,transparent 55%,rgba(14,8,3,.62) 100%)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
/* Pergamino: grano, manchas de envejecimiento y doble filete entintado */
.glass{color:var(--ink);background:var(--grain),radial-gradient(ellipse at 22% 18%,rgba(255,250,232,.6),transparent 58%),radial-gradient(ellipse at 85% 92%,rgba(126,82,36,.22),transparent 55%),var(--parch);border:1px solid #7d5e36;border-radius:3px;box-shadow:inset 0 0 0 3px rgba(233,219,186,.0),inset 0 0 0 4px rgba(92,62,32,.38),inset 0 0 26px rgba(120,76,30,.32),0 10px 26px rgba(0,0,0,.5)}

/* ---------- barra superior: casas nobles ---------- */
#top{position:fixed;z-index:3;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:flex;gap:12px;align-items:flex-start;pointer-events:none}
#top > *{pointer-events:auto}
.brand{font:400 22px/1 var(--display);letter-spacing:.03em;color:var(--seal);padding:10px 14px;white-space:nowrap}
.brand small{display:block;font:italic 400 13px/1.2 var(--italic);color:var(--ink-2);margin-top:4px;letter-spacing:.01em}
#players{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:8px;flex:1;min-width:0;max-width:780px}
.pl{padding:8px 12px 9px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:'crest name vp' 'st st st' 'badges badges badges';column-gap:10px;row-gap:7px;align-items:center;transition:transform .25s, box-shadow .25s;min-width:0}
.pl.active{transform:translateY(3px);box-shadow:inset 0 0 0 4px rgba(141,42,28,.5),inset 0 0 26px rgba(120,76,30,.32),0 0 0 2px var(--seal),0 12px 28px rgba(0,0,0,.55)}
.pl .piece{grid-area:crest;width:30px;height:33px;filter:drop-shadow(0 2px 2px rgba(40,20,5,.45))}
.pl .piece svg{width:100%;height:100%;display:block}
.pl .nm{grid-area:name;font:400 18px/1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:center}
/* Puntos en un sello de lacre, como el botón principal */
.pl .vp{grid-area:vp;position:relative;margin:5px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 18px/1 var(--num);color:#f6e7c8;text-shadow:0 1px 0 rgba(0,0,0,.4);background:radial-gradient(circle at 35% 30%,#c0503c,var(--seal) 58%,#661b11);box-shadow:inset 0 0 0 3px rgba(255,200,170,.18),inset 0 -2px 4px rgba(0,0,0,.35),0 2px 3px rgba(50,20,8,.4)}
.pl .vp::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(#b4873d calc(var(--pct,0)*1%),rgba(92,62,32,.22) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px))}
.pl .st{grid-area:st;min-width:0;display:flex;justify-content:space-between;gap:6px;white-space:nowrap;font:600 12.5px/1 var(--num);color:var(--ink-2);padding-top:6px;border-top:1px solid rgba(92,62,32,.25)}
.pl .st span{display:inline-flex;gap:3px;align-items:center}
.pl .st svg{width:13px;height:13px}
.badges{grid-area:badges;display:flex;gap:4px;flex-wrap:wrap}
.badges:empty{display:none}
.badge{font:400 11px/1 var(--display);letter-spacing:.04em;padding:3px 7px 2px;border-radius:2px;background:var(--seal);color:#f3e4c4}
.top-actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;cursor:pointer;font:400 20px var(--display);color:var(--seal)}

/* ---------- indicación central ---------- */
#banner{position:fixed;z-index:3;left:50%;transform:translateX(-50%);top:calc(var(--topH,92px) + 10px);padding:8px 16px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);font:italic 400 17px/1.25 var(--italic);text-align:center}
#banner[hidden]{display:none!important}
#banner b{color:var(--seal);font-style:normal;font-family:var(--display);font-weight:400}
.btn{cursor:pointer;border-radius:3px;border:1px solid var(--rule);background:linear-gradient(180deg,rgba(255,248,228,.5),rgba(140,100,50,.08));padding:7px 13px;font:600 15px var(--body);color:var(--ink);transition:background .15s,border-color .15s,opacity .15s,transform .1s}
.btn:hover:not(:disabled){border-color:#6b4a24;background:linear-gradient(180deg,rgba(255,250,235,.8),rgba(140,100,50,.16))}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{cursor:not-allowed;color:rgba(44,32,22,.5);background:rgba(140,100,50,.05);border-color:rgba(92,62,32,.25)}
.btn:disabled svg{opacity:.4;filter:grayscale(.7)}
.btn.primary:disabled{opacity:.55;filter:saturate(.6)}
/* Botón principal como sello de lacre */
.btn.primary{background:radial-gradient(ellipse at 35% 25%,#c0503c,var(--seal) 60%,#6a1c12);color:#f6e7c8;border-color:#5a160e;box-shadow:inset 0 1px 0 rgba(255,210,180,.3),0 2px 4px rgba(60,20,10,.35);text-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.primary:hover:not(:disabled){background:radial-gradient(ellipse at 35% 25%,#cf5d48,var(--seal-hi) 60%,#741f14)}
.btn.small{padding:4px 10px;font-size:14px}

/* ---------- crónica ---------- */
#log{position:fixed;z-index:2;right:16px;top:calc(var(--topH,92px) + 66px);width:290px;max-height:42vh;display:flex;flex-direction:column;overflow:hidden}
#log h3{margin:0;padding:10px 14px 4px;font:400 18px var(--display);color:var(--seal);border-bottom:1px solid var(--rule);margin:0 12px}
#logList{list-style:none;margin:0;padding:8px 14px 12px;overflow-y:auto;font-size:15px;display:flex;flex-direction:column;gap:4px;min-height:0}
#logList li{line-height:1.28}
#logList li::first-letter{font-family:var(--display)}
#logList li.sys{color:var(--ink-2);font-family:var(--italic);font-style:italic}
.ri{display:inline-flex;align-items:center;gap:1px;vertical-align:-3px;font-variant-numeric:tabular-nums}
.ri svg{width:19px;height:19px}

/* ---------- mano y acciones ---------- */
#bottom{position:fixed;z-index:3;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:10px;align-items:flex-end;justify-content:center;flex-wrap:wrap;pointer-events:none}
#bottom > *{pointer-events:auto}
#hand{padding:8px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{position:relative;width:54px;height:64px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:linear-gradient(180deg,#f3e7c9,#dcc699);border:1px solid #8a6a40;box-shadow:inset 0 0 0 2px #f1e4c4,inset 0 0 0 3px rgba(92,62,32,.35),inset 0 0 10px rgba(120,76,30,.25),0 1px 2px rgba(40,20,5,.25)}
.chip svg{width:32px;height:32px;flex:none}
.chip b{font:700 15px/1 var(--num);color:var(--ink)}
.chip.zero svg{opacity:.35;filter:grayscale(.6)}
.chip.zero b{color:var(--ink-2);opacity:.6}
.chip.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.18);border-color:var(--seal);box-shadow:0 0 0 2px rgba(141,42,28,.35)}}
.sep{width:1px;align-self:stretch;background:var(--rule);margin:0 4px}
.dev{cursor:pointer;height:60px;min-width:62px;padding:0 8px;border-radius:3px;border:1px solid var(--rule);background:linear-gradient(180deg,#f1e4c5,#dcc596);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;font:400 14px/1.05 var(--display);text-align:center;color:var(--ink)}
.dev small{font:italic 400 12px var(--italic);color:var(--ink-2)}
.dev.play{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal),inset 0 0 10px rgba(141,42,28,.2)}
.dev:disabled{cursor:default;opacity:.6}
#actions{padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:70px;min-height:52px;padding:6px 9px}
.act .cost{display:flex;gap:0;height:18px;align-items:center}
.act .cost{gap:1px}
.act .cost svg{width:16px;height:16px}
.kbd{font:italic 400 12px var(--italic);opacity:.8}
@media (pointer:coarse){.kbd{display:none}}
.act span{font-size:14px}
.btn.primary.act span{font-family:var(--display);font-weight:400}

/* ---------- dados ---------- */
#roll{position:fixed;z-index:2;left:16px;top:calc(var(--topH,92px) + 66px);padding:9px 14px;display:flex;gap:10px;align-items:center}
#roll .d{width:30px;height:30px;border-radius:6px;background:linear-gradient(160deg,#f3e9d2,#d6c6a2);color:#4a1b12;display:grid;place-items:center;font:700 16px var(--num);box-shadow:inset 0 -2px 3px rgba(80,50,20,.3),0 1px 2px rgba(0,0,0,.3)}
#roll .d.r{background:linear-gradient(160deg,#6b4428,#3f2614);color:#efe2c4}
#roll .sum{font:700 26px/1 var(--num);color:var(--seal);font-variant-numeric:tabular-nums lining-nums}
#roll .lbl{font:italic 400 13px var(--italic);color:var(--ink-2)}

/* ---------- ventanas ---------- */
#modal{position:fixed;inset:0;z-index:10;display:grid;grid-template-rows:100%;place-items:center;background:radial-gradient(ellipse at center,rgba(10,6,3,.35),rgba(10,6,3,.7));padding:12px}
#modal[hidden]{display:none!important}
/* Carta de pergamino con bordes rasgados (clip-path generado) y sombra en el envoltorio */
.sheet-wrap{width:min(560px,100%);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);display:flex;filter:drop-shadow(0 18px 30px rgba(0,0,0,.65));animation:unroll .35s cubic-bezier(.2,.9,.3,1)}
@keyframes unroll{from{transform:translateY(18px) scale(.96);opacity:0}}
.sheet{width:100%;overflow:auto;padding:24px 24px 20px;border:none;border-radius:0;clip-path:var(--deckle,none);box-shadow:inset 0 0 60px rgba(110,70,25,.38),inset 0 0 0 9px rgba(233,219,186,0),inset 0 0 0 10px rgba(92,62,32,.3)}
.sheet h2{margin:0;font:400 27px/1.05 var(--display);color:var(--seal);text-wrap:balance}
.sheet p{margin:10px 0 12px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)}
.letterhead{display:flex;gap:14px;align-items:center;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--rule)}
.letterhead .sub{margin:4px 0 0;font:italic 400 15.5px/1.2 var(--italic);color:var(--ink-2)}
/* Sellos: lacre del color del jugador o moneda de latón con balanza */
.wax{flex:none;width:58px;height:58px;display:grid;place-items:center;border-radius:48% 52% 46% 54%/52% 46% 54% 48%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.38),transparent 38%),var(--wc);background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.38),transparent 38%),radial-gradient(circle,var(--wc) 52%,color-mix(in srgb,var(--wc) 60%,#000) 100%);box-shadow:inset 0 0 0 4px rgba(0,0,0,.12),inset 0 -3px 6px rgba(0,0,0,.35),0 3px 5px rgba(40,15,5,.45)}
.wax svg{width:30px;height:33px}
.wax.sm{width:40px;height:40px}.wax.sm svg{width:21px;height:23px}
.wax.brass{background:radial-gradient(circle at 32% 28%,#fff1c4,transparent 40%),radial-gradient(circle,#d4a94e 50%,#7d5718 100%);border-radius:50%}
.wax.brass svg{width:40px;height:40px}
.cap{font:400 16px var(--display);color:var(--seal);text-align:center;margin:10px 0 0}
.cap i{font:italic 400 14px var(--italic);color:var(--ink-2)}
.cardrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 4px 6px}
/* Naipe de recurso */
.rcard{position:relative;width:68px;height:106px;flex:none;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 3px 7px;color:var(--ink);font:inherit;background:linear-gradient(180deg,#f5eacd,#dcc597);border:1px solid #7d5e36;box-shadow:inset 0 0 0 3px #f2e5c6,inset 0 0 0 4px rgba(92,62,32,.38),inset 0 0 14px rgba(120,76,30,.25),0 3px 6px rgba(40,20,5,.35);transition:transform .15s,box-shadow .15s,opacity .15s}
.rcard .nm{font:400 12px/1 var(--display);white-space:nowrap}
.rcard .art svg{width:36px;height:36px;display:block}
.rcard .foot{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:26px;justify-content:flex-end}
.rcard .big{font:700 15px/1 var(--num);color:var(--ink)}
.rcard .note{font:italic 400 11px/1 var(--italic);color:var(--ink-2);white-space:nowrap}
.rcard.on{box-shadow:inset 0 0 0 3px #f2e5c6,inset 0 0 0 4px rgba(141,42,28,.5),0 0 0 2px var(--seal),0 6px 10px rgba(40,20,5,.35)}
.rcard.on .big{color:var(--seal)}
button.rcard{cursor:pointer}
button.rcard:hover:not(:disabled){transform:translateY(-3px)}
button.rcard[aria-pressed="true"]{transform:translateY(-7px) rotate(-2deg);box-shadow:inset 0 0 0 3px #f2e5c6,inset 0 0 0 4px rgba(141,42,28,.5),0 0 0 2px var(--seal),0 12px 16px rgba(40,20,5,.4)}
button.rcard:disabled{opacity:.42;filter:grayscale(.6);cursor:not-allowed}
.stp{display:flex;flex-direction:column;align-items:center;gap:7px}
.stp .pm{display:flex;gap:6px}
/* Clavijas de madera para sumar y restar */
.peg{width:28px;height:28px;border-radius:50%;cursor:pointer;font:700 16px/1 var(--body);color:#f3e4c4;border:1px solid #3a2414;background:radial-gradient(circle at 35% 30%,#9a6b3e,#5a3820 70%);box-shadow:inset 0 -2px 3px rgba(0,0,0,.35),0 2px 3px rgba(40,20,5,.35)}
.peg:disabled{opacity:.3;cursor:not-allowed}
.xchg{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:6px 0}
.xchg .side{min-width:0}
.scale{display:grid;place-items:center}
.scale svg{width:52px;height:52px}
.scale.mid svg{width:40px;height:40px}
.scale.mid{margin:2px 0 -6px}
.tally{margin-right:auto;font:italic 400 15px var(--italic);color:var(--ink-2)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.ribbons{justify-content:center;margin:12px 0 2px}
.opt-group .hint{margin-top:10px!important}
.ribbons .btn{font:400 15px var(--display)}
.ribbons .btn[aria-pressed="true"]{background:radial-gradient(ellipse at 35% 25%,#c0503c,var(--seal) 60%,#6a1c12);color:#f6e7c8;border-color:#5a160e}
.lords{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.lord{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:3px;border:1px solid var(--rule);background:rgba(255,248,228,.4);text-align:left;font:inherit;color:inherit}
button.lord{cursor:pointer}
button.lord:hover{background:rgba(255,248,228,.75);border-color:var(--seal)}
.lord .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lord .wax,.lord .nay,.lord .btn{flex:none}
.lord b{font:400 18px var(--display)}
.lord i{font:italic 400 14px var(--italic);color:var(--ink-2)}
/* Rechazo como sello estampado */
.nay{font:400 15px var(--display);color:var(--seal);border:2px solid var(--seal);padding:2px 8px 1px;border-radius:3px;transform:rotate(-7deg);opacity:.85}
@media (max-width: 480px){
  .sheet{padding:20px 14px 16px}
  .sheet h2{font-size:23px}
  .wax{width:48px;height:48px}
  .rcard{width:58px;height:98px;padding:7px 2px 6px}
  .rcard .art svg{width:30px;height:30px}
  .rcard .nm{font-size:10.5px}
  .rcard .note{font-size:10px}
  .cardrow{gap:6px}
  .peg{width:25px;height:25px}
  .xchg{grid-template-columns:1fr;gap:0}
  .xchg .scale svg{width:40px;height:40px}
}
.lbl2{font:400 16px var(--display);color:var(--seal);margin:14px 0 6px}
.costs{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin:8px 0}
.costs b{font:400 16px var(--display)}
.rules{padding-left:18px;margin:6px 0;font-size:15.5px}
.rules li{margin:3px 0}
.rank{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.rank div{display:flex;justify-content:space-between;padding:8px 12px;border-radius:3px;background:rgba(120,80,40,.08);font:400 19px var(--display)}
.rank div span:last-child{font:700 16px var(--num)}

#toast{position:fixed;z-index:12;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translate(-50%,10px);opacity:0;transition:opacity .25s,transform .25s;padding:9px 16px;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}

#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#3a2614,#120c07 70%);transition:opacity .7s}
#loading.done{opacity:0;pointer-events:none}
#loading .in{text-align:center;padding:16px}
#loading h1{margin:0;font:400 clamp(36px,8vw,64px)/1 var(--display);color:#ead7ae;text-shadow:0 2px 18px rgba(255,170,80,.25)}
#loading p{color:#b79d76;font:italic 400 17px var(--italic);margin-top:14px}
#loading .err{color:#f0a28e;font-style:normal;font-size:15px;max-width:420px;display:inline-block}

/* ---------- pantallas estrechas ---------- */
@media (max-width: 860px){
  .brand{display:none}
  #log{display:none}
  #log.open{display:flex;left:16px;right:16px;width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 190px);max-height:34vh}
  #roll{top:calc(var(--topH,92px) + 10px);padding:6px 10px}
  #banner{top:calc(var(--topH,92px) + 10px);left:auto;right:16px;transform:none;max-width:calc(100% - 150px);font-size:15px;padding:7px 10px}
}
@media (max-width: 600px){
  #top{padding-left:10px;padding-right:10px;gap:6px}
  #players{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .pl{padding:6px 9px 7px;column-gap:7px;row-gap:5px}
  .pl .nm{font-size:15.5px}
  .pl .vp{width:28px;height:28px;margin:4px;font-size:13px}
  .pl .piece{width:22px;height:24px}
  .pl .st{gap:3px;font-size:11px;padding-top:5px}
  .pl .st svg{width:11px;height:11px}
  .badges{display:none}
  .icon-btn{width:36px;height:36px}
  .top-actions{flex-direction:column;gap:5px}
  #bottom{padding:0 8px calc(env(safe-area-inset-bottom,0px) + 8px);gap:6px}
  #hand{padding:5px 6px;gap:4px;justify-content:center}
  .chip{width:44px;height:54px}
  .chip svg{width:26px;height:26px}
  .chip b{font-size:13px}
  .dev{height:48px;min-width:48px;font-size:12px;padding:0 5px}
  #actions{padding:5px;gap:4px}
  .act{min-width:0;min-height:46px;padding:5px 7px}
  .act span{font-size:13px}
  .act .cost svg{width:13px;height:13px}
  .steppers,.pickres{gap:4px}
}
/* ---------- efectos: cartas que vuelan, sellos, sacudidas ---------- */
#fx{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.fly{position:absolute;left:0;top:0;width:34px;height:44px;margin:-22px 0 0 -17px;border-radius:3px;display:grid;place-items:center;will-change:transform,opacity;background:linear-gradient(180deg,#f3e7c9,#d7bf8e);border:1px solid #7d5e36;box-shadow:inset 0 0 0 2px #f1e4c4,inset 0 0 0 3px rgba(92,62,32,.35),0 8px 16px rgba(0,0,0,.45)}
.fly svg{width:26px;height:26px}
.fly.back{background:radial-gradient(circle at 50% 45%,#a93a2a,#651a10);border-color:#3e0f08;box-shadow:inset 0 0 0 2px rgba(217,178,90,.55),0 8px 16px rgba(0,0,0,.45)}
.fly.back::after{content:"";width:14px;height:14px;border-radius:50%;border:2px solid #d9b25a}
.fly.dev{background:linear-gradient(180deg,#2f3d5c,#1b2338);border-color:#0d1220;box-shadow:inset 0 0 0 2px rgba(217,178,90,.6),0 8px 16px rgba(0,0,0,.45)}
.fly.dev::after{content:"?";font:400 22px var(--display);color:#e3c36f}
.pl.gain{animation:gain .7s}
@keyframes gain{35%{box-shadow:inset 0 0 0 4px rgba(214,174,85,.8),0 0 0 3px #d6ae55,0 0 22px rgba(255,210,120,.7)}}
.pl.robbed,#hand.robbed{animation:robbed .7s}
@keyframes robbed{10%,50%,90%{transform:translateX(-6px)}30%,70%{transform:translateX(6px)}20%{box-shadow:0 0 0 3px #b3261e,0 0 24px rgba(200,40,20,.7)}}
.pl .vp.pop{animation:pop .8s}
@keyframes pop{30%{transform:scale(1.4) rotate(-8deg)}60%{transform:scale(.92)}}
#stamp{position:fixed;left:50%;top:44%;z-index:7;pointer-events:none;transform:translate(-50%,-50%)}
.stamp{padding:14px 30px 12px;text-align:center;color:var(--seal);border:3px double var(--seal);border-radius:3px;background:var(--grain),rgba(236,222,190,.96);box-shadow:inset 0 0 26px rgba(120,76,30,.3),0 16px 40px rgba(0,0,0,.55);animation:stampIn 1.9s cubic-bezier(.2,.9,.3,1) forwards;rotate:-4deg;white-space:nowrap}
.stamp b{display:block;font:400 clamp(30px,7vw,46px)/1 var(--display)}
.stamp small{display:block;font:italic 400 17px var(--italic);color:var(--ink);margin-top:6px}
@keyframes stampIn{0%{transform:scale(2.4);opacity:0}12%{transform:scale(.94);opacity:1}18%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
#flash{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(150,20,10,.55))}
#flash.on{animation:flash 1.1s}
@keyframes flash{15%{opacity:1}100%{opacity:0}}
.leaf{position:absolute;top:-20px;width:10px;height:14px;border-radius:50% 0;background:linear-gradient(135deg,#f0d27a,#a9771f);animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
/* ---------- menú principal: página propia ----------
   Escritorio: estandarte de pergamino a la izquierda y la mesa girando a la derecha.
   Móvil: la mesa arriba y el pergamino ocupando el resto de la página. */
#menu{position:fixed;inset:0;z-index:9;display:grid;grid-template-columns:minmax(340px,440px) 1fr;pointer-events:none}
#menu[hidden]{display:none!important}
#menu > *{pointer-events:auto}
body.in-menu #top,body.in-menu #bottom,body.in-menu #log,body.in-menu #roll,body.in-menu #banner{display:none!important}
body.in-menu #vignette{background:linear-gradient(90deg,rgba(14,8,3,.55),transparent 45%),radial-gradient(ellipse 75% 70% at 65% 50%,transparent 50%,rgba(14,8,3,.6) 100%)}
.mpanel{height:100%;overflow:auto;border-radius:0;border:none;border-right:1px solid #7d5e36;padding:calc(env(safe-area-inset-top,0px) + 34px) 34px calc(env(safe-area-inset-bottom,0px) + 26px);display:flex;flex-direction:column;box-shadow:inset -14px 0 36px rgba(110,70,25,.3),inset 0 0 0 6px rgba(233,219,186,0),12px 0 40px rgba(0,0,0,.55)}
.mpanel h2{margin:0;font:400 28px/1.05 var(--display);color:var(--seal)}
.mpanel p{margin:8px 0 10px}
.mpanel .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin-top:14px}
.mscene{display:flex;align-items:flex-end;justify-content:center;padding:28px;pointer-events:none}
.mtag{text-align:center;color:#ecdcb4;text-shadow:0 2px 12px rgba(0,0,0,.85)}
.mtag strong{display:none;font:400 38px/1 var(--display);color:#f1e2bd}
.mtag span{display:block;font:italic 400 19px var(--italic)}
.mhead{text-align:center}
.mhead .crest svg{width:64px;height:70px;filter:drop-shadow(0 3px 4px rgba(40,20,5,.45))}
.mhead h1{margin:10px 0 0;font:400 clamp(38px,5vw,50px)/.95 var(--display);color:var(--seal);text-wrap:balance}
.mhead p{margin:8px 0 0;font:italic 400 17px var(--italic);color:var(--ink-2)}
/* Filete con rombo central, como en los manuscritos */
.flourish{height:14px;margin:18px 0 8px;background:linear-gradient(var(--rule),var(--rule)) left center/calc(50% - 12px) 1px no-repeat,linear-gradient(var(--rule),var(--rule)) right center/calc(50% - 12px) 1px no-repeat;position:relative}
.flourish::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;background:var(--seal);transform:translate(-50%,-50%) rotate(45deg)}
.mnav{display:flex;flex-direction:column}
.mitem{display:flex;align-items:center;gap:14px;padding:16px 4px;border:none;border-bottom:1px solid var(--rule);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:padding .2s,background .2s}
.mitem:first-child{border-top:1px solid var(--rule)}
.mitem:hover:not([aria-disabled]),.mitem:focus-visible{padding-left:12px;background:linear-gradient(90deg,rgba(141,42,28,.08),transparent)}
.mitem .crest{flex:none;width:48px;display:flex;justify-content:center}
.mitem .crest svg{width:38px;height:42px}
.mitem .crest.trio svg{width:26px;height:29px;margin:0 -6px}
.mitem b{display:block;font:400 23px/1.1 var(--display);color:var(--seal)}
.mitem i{font:italic 400 15px var(--italic);color:var(--ink-2)}
.mitem .chev{margin-left:auto;font:400 26px var(--display);color:var(--seal)}
.mitem[aria-disabled]{cursor:default}
.soon{margin-left:auto;font:400 13px var(--display);color:var(--seal);border:2px solid var(--seal);padding:2px 7px 1px;border-radius:3px;transform:rotate(-6deg);opacity:.85;white-space:nowrap}
.mlinks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.mfoot{margin-top:auto;padding-top:24px;text-align:center;font:italic 400 14px var(--italic);color:var(--ink-2)}
.back{align-self:flex-start;border:none;background:none;padding:4px 0;margin-bottom:14px;cursor:pointer;font:400 16px var(--display);color:var(--seal)}
.back:hover{text-decoration:underline}
.opt-group{padding:12px 0 8px;border-bottom:1px dashed var(--rule)}
.hint{margin:6px 0 0!important;text-align:center;font:italic 400 14.5px var(--italic);color:var(--ink-2)}
.vpstep{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px}
.vpstep .num{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:700 24px var(--num);color:#f6e7c8;background:radial-gradient(circle at 35% 30%,#c0503c,var(--seal) 58%,#661b11);box-shadow:inset 0 0 0 4px rgba(255,200,170,.18),inset 0 -3px 5px rgba(0,0,0,.35),0 3px 5px rgba(50,20,8,.4)}
.vpstep .peg{width:34px;height:34px;font-size:19px}
.rivals{display:flex;justify-content:center;gap:12px;margin-top:10px}
.rivals span{display:flex;flex-direction:column;align-items:center;gap:3px;font:400 13px var(--display);transition:opacity .2s}
.rivals svg{width:28px;height:31px}
.rivals span.off{opacity:.25;filter:grayscale(1)}
.mcta{margin-top:auto;padding-top:16px;position:sticky;bottom:-26px;padding-bottom:4px;background:linear-gradient(transparent,var(--parch-solid) 30%)}
.mcta .btn{width:100%;padding:13px;font:400 21px var(--display)}
.mcta .btn + .btn{margin-top:8px}
.btn.danger{background:none;border-color:transparent;color:var(--seal);font:italic 400 16px var(--italic)!important;padding:8px}
.btn.danger:hover{text-decoration:underline;background:none}
.smeta{margin:6px 0 0;font:italic 400 16px var(--italic);color:var(--ink-2)}
.savefacts{display:grid;grid-template-columns:repeat(3,1fr);margin:6px 0 2px}
.savefacts div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 6px;text-align:center}
.savefacts div + div{border-left:1px solid var(--rule)}
.savefacts dt{font:italic 400 13.5px var(--italic);color:var(--ink-2)}
.savefacts dd{margin:0;font:400 19px/1.1 var(--display);color:var(--seal)}
.savefacts dd .n{font:700 17px var(--num)}
.standings{list-style:none;margin:6px 0 0;padding:0}
.standings li{display:grid;grid-template-columns:auto 30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--rule)}
.standings li:first-child{border-top:1px solid var(--rule)}
.standings .pos{font:700 13px var(--num);color:var(--ink-2);width:14px;text-align:center}
.standings svg{width:28px;height:31px;display:block}
.standings b{display:block;font:400 19px/1.1 var(--display)}
.standings i{display:block;font:italic 400 14px/1.25 var(--italic);color:var(--ink-2)}
.standings .me{font:italic 400 13px var(--italic);color:var(--ink-2);margin-left:4px}
.lpts{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--num);color:#f6e7c8;background:radial-gradient(circle at 35% 30%,#c0503c,var(--seal) 58%,#661b11);box-shadow:inset 0 -2px 4px rgba(0,0,0,.35),0 2px 3px rgba(50,20,8,.35)}
/* ---------- móvil apaisado: poca altura ---------- */
/* Los jugadores van en una columna a la izquierda, la mano y las acciones en columnas a la derecha; el tablero queda libre en el centro */
@media (max-height: 520px) and (orientation: landscape){
  .brand{display:none}
  #log{display:none}
  #log.open{display:flex;left:170px;right:190px;width:auto;top:46px;bottom:auto;max-height:calc(100vh - 60px)}
  #top{left:0;right:auto;top:0;bottom:0;width:166px;flex-direction:column;align-items:stretch;padding:calc(env(safe-area-inset-top,0px) + 6px) 0 6px calc(env(safe-area-inset-left,0px) + 8px);gap:4px;overflow:hidden}
  #players{display:flex;flex-direction:column;gap:4px;max-width:none;flex:none;min-width:0}
  .pl{padding:3px 7px 4px;column-gap:6px;row-gap:2px}
  .pl.active{transform:none}
  .pl .nm{font-size:13.5px}
  .pl .vp{width:24px;height:24px;margin:3px;font-size:11.5px}
  .pl .vp::before{inset:-4px}
  .pl .piece{width:18px;height:20px}

.mcard:not([aria-pressed="true"]) .art *{animation-play-state:paused!important}
.mcard .art .wave{animation:mcWave 3s linear infinite}
@keyframes mcWave{to{transform:translateX(20px)}}
/* clásico: camino que crece y poblados que brotan, dado que gira */
.mcard .art .road{stroke-dasharray:60;stroke-dashoffset:60;animation:mcDash 4s ease-in-out infinite}
@keyframes mcDash{0%,15%{stroke-dashoffset:60}55%,100%{stroke-dashoffset:0}}
.mcard .art .pop1,.mcard .art .pop2,.mcard .art .camp,.mcard .art .knight,.mcard .art .anchor,.mcard .art .flag{transform-box:fill-box;transform-origin:center}
.mcard .art .pop1{animation:mcPop 4s ease-out infinite}
.mcard .art .pop2{animation:mcPop 4s ease-out infinite;animation-delay:1.6s}
@keyframes mcPop{0%,5%{transform:scale(0)}18%,100%{transform:scale(1)}}
.mcard .art .dice{animation:mcSpin 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes mcSpin{0%,70%{transform:rotate(0)}85%{transform:rotate(380deg)}100%{transform:rotate(360deg)}}
/* navegantes: el barco cruza y funda un poblado */
.mcard .art .sail1{animation:mcSail 5s ease-in-out infinite}
@keyframes mcSail{0%{transform:translate(40px,50px)}60%,100%{transform:translate(80px,50px)}}
.mcard .art .plus,.mcard .art .plus2,.mcard .art .plus3{opacity:0}
.mcard .art .plus{animation:mcPlus 5s ease-out infinite;animation-delay:3.2s}
.mcard[data-mode="seafarers"] .art .pop2{animation:mcPop 5s ease-out infinite;animation-delay:3s}
@keyframes mcPlus{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:translateY(0)}60%{opacity:1}80%,100%{opacity:0}}
/* piratas: niebla que se descubre al paso del barco y guarida asaltada */
.mcard .art .sail2{animation:mcSail2 6s ease-in-out infinite}
@keyframes mcSail2{0%{transform:translate(38px,46px)}35%{transform:translate(56px,42px)}70%,100%{transform:translate(78px,46px)}}
.mcard .art .fog{animation:mcFog 6s ease-out infinite}

@keyframes mcFog{0%,18%{opacity:1}30%,100%{opacity:0}}
.mcard .art .flag{animation:mcFlag 6s ease-in infinite}
@keyframes mcFlag{0%,78%{transform:scale(1)}90%,100%{transform:scale(0)}}
.mcard .art .plus2{animation:mcPlus 6s ease-out infinite;animation-delay:4.8s}

.mcard .art .camp{animation:mcCamp 6s ease-out infinite}

.mcard .art .fire{animation:mcFire .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}

e game ends.","Crear partida":"Create game","Se usarán los ajustes de la partida individual: {0} jugadores, {1}, {2}, {3} puntos.":"The single-player settings will be used: {0} players, {1}, {2}, {3} points.","Crear y obtener código":"Create and get code","Unirse a una partida":"Join a game","CÓDIGO":"CODE","Unirse":"Join","Elige cómo quieres jugar con otras personas.":"Choose how you want to play with other people.","Entre amigos (P2P)":"Among friends (P2P)","Un código, sin servidor. Versión de prueba.":"One code, no server. Trial version.","Servidor":"Server","Salas que no dependen del anfitrión: la partida sigue aunque alguien cierre":"Rooms that don't depend on the host: the game goes on even if someone closes","Dirección guardada":"Address saved","Escribe tu nombre.":"Type your name.","Escribe el código de 5 caracteres.":"Type the 5-character code.","Escribe un nombre.":"Type a name.","Partida guardada borrada.":"Saved game deleted.","No hay ninguna partida guardada.":"There's no saved game.","Partida reanudada (guardada {0}).":"Game resumed (saved {0}).","Partida reanudada":"Game resumed","Turno {0} · {1} tiene la palabra":"Turn {0} · {1} to play","Nuevo mapa de {0}{1}: {2} jugadores, dificultad {3}, victoria con {4} puntos. Empieza colocando {5}; la colocación sigue en serpiente.":"New map of {0}{1}: {2} players, {3} difficulty, victory at {4} points. {5} places first; placement then snakes back.","error desconocido":"unknown error","Se ha producido un error. Está anotado en la crónica.":"Something went wrong. It's noted in the chronicle.","No se pudieron cargar las librerías 3D. Comprueba la conexión y recarga la página.":"Couldn't load the 3D libraries. Check the connection and reload the page.","Escribe tu nombre y pulsa Unirse.":"Type your name and press Join.","Tu navegador no admite WebGL.":"Your browser doesn't support WebGL.","Tablero 3D":"3D board","Reglas y costes":"Rules and costs","Crónica":"Chronicle","Mostrar crónica":"Show chronicle","Idioma":" /* ---------- idiomas: castellano (original), euskera e inglés ----------
   Los textos del juego pasan por TR: TR('texto') o TR`plantilla ${x}`. Si el idioma no es el castellano,
   cada trozo de texto entre etiquetas HTML se busca en I18N[idioma] (clave = texto original, con {0}, {1}…
   en los huecos). En las traducciones, {0:k}, {0:ren}, {0:ri} y {0:rekin} añaden al nombre la declinación vasca. */
const LANGS = [['es', 'Castellano'], ['eu', 'Euskara'], ['en', 'English']];
const LANG = (() => {
  let l = '';
  try { l = localStorage.getItem('hexaria.lang') || ''; } catch (e) {}
  if (!l) { const n = String(navigator.language || 'es').slice(0, 2).toLowerCase(); l = n === 'eu' ? 'eu' : n === 'en' ? 'en' : 'es'; }
  return LANGS.some(x => x[0] === l) ? l : 'es';
})();
document.documentElement.lang = LANG;
const TR = (() => {
  const D = LANG === 'es' ? null : (I18N[LANG] || null);
  const INLINE = /^<\/?(b|em|strong|u|sup|sub)(\s[^>]*)?>$/i;
  const ATTR = /\b(title|aria-label|placeholder|alt)="([^"]*)"/g;
  const SUF = { k: ['k', 'ek'], ren: ['ren', 'en'], ri: ['ri', 'i'], rekin: ['rekin', 'ekin'] };
  // declinación vasca sobre un valor (texto o <b>nombre</b>): tras vocal o tras consonante
  const decl = (v, m) => {
    const s = SUF[m]; if (!s) return v;
    return String(v).replace(/([^<>\s])((?:<\/[^>]+>)*)\s*$/, (_, c, tail) => c + (/[aeiouáéíóú]/i.test(c) ? s[0] : s[1]) + tail);
  };
  // traduce un trozo de texto; los huecos van como ⟦n⟧ o ⟦n:mod⟧
  function piece(s) {
    const m = s.match(/^(\s*)([\s\S]*?)(\s*)$/);
    let pre = m[1], post = m[3], core = m[2];
    const w = core.match(/^(<(b|em|strong)>)([^<]*)(<\/\2>)$/);
    if (w) { pre += w[1]; post = w[4] + post; core = w[3]; }
    if (!core) return s;
    const map = [];
    const key = core.replace(/⟦(\d+)⟧/g, (_, n) => { let i = map.indexOf(+n); if (i < 0) { i = map.length; map.push(+n); } return '{' + i + '}'; });
    const v = D[key];
    if (v == null) return s;
    return pre + v.replace(/\{(\d+)(?::(\w+))?\}/g, (_, i, mod) => map[+i] === undefined ? '' : '⟦' + map[+i] + (mod ? ':' + mod : '') + '⟧') + post;
  }
  function attrs(tag) {
    return tag.replace(ATTR, (all, a, val) => {
      const t = piece(val);
      return t === val ? all : `${a}="${t}"`;
    });
  }
  function str(S) {
    const parts = S.split(/(<[^>]*>)/); let out = '', run = '';
    for (const p of parts) {
      if (!p) continue;
      if (p[0] === '<' && p[p.length - 1] === '>' && !INLINE.test(p)) { out += (run ? piece(run) : '') + attrs(p); run = ''; }
      else run += p;
    }
    return out + (run ? piece(run) : '');
  }
  const cache = new Map();
  const tr = S => { let r = cache.get(S); if (r === undefined) { r = str(S); if (cache.size > 4000) cache.clear(); cache.set(S, r); } return r; };
  function T(s, ...vals) {
    if (Array.isArray(s) && s.raw) {
      if (!D) { let o = s[0]; for (let i = 0; i < vals.length; i++) o += vals[i] + s[i + 1]; return o; }
      let S = s[0]; for (let i = 0; i < vals.length; i++) S += '⟦' + i + '⟧' + s[i + 1];
      return tr(S).replace(/⟦(\d+)(?::(\w+))?⟧/g, (_, i, mod) => { const v = `${vals[+i]}`; return mod ? decl(v, mod) : v; });
    }
    if (!D || typeof s !== 'string') return s;
    return tr(s).replace(/⟦\d+(?::\w+)?⟧/g, '');
  }
  // traduce el HTML fijo de la página (textos y atributos)
  T.dom = root => {
    if (!D) return;
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n; (n = tw.nextNode());) { if (/\S/.test(n.nodeValue)) { const t = T(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; } }
    root.querySelectorAll('[title],[aria-label],[placeholder]').forEach(el => ['title', 'aria-label', 'placeholder'].forEach(a => { const v = el.getAttribute(a); if (v) el.setAttribute(a, T(v)); }));
  };
  T.lang = LANG;
  return T;
})();
TR.dom(document.body);
</script>
<script id="core">
/* =====================================================================
   1 · NÚCLEO DEL JUEGO
   Reglas, tablero e IA. Sin DOM ni Three.js: se puede probar aislado.
   ===================================================================== */
const Core = (() => {
  'use strict';
  const RES = ['wood', 'brick', 'wheat', 'wool', 'ore'];
  const RES_NAME = { wood: TR('Madera'), brick: TR('Arcilla'), wheat: TR('Trigo'), wool: TR('Lana'), ore: TR('Mineral') };
  const TERRAINS = {
    forest:    { res: 'wood',  name: TR('Bosque') },
    hills:     { res: 'brick', name: TR('Colinas') },
    mountains: { res: 'ore',   name: TR('Montañas') },
    fields:    { res: 'wheat', name: TR('Campos') },
    pasture:   { res: 'wool',  name: TR('Pastos') },
    desert:    { res: null,    name: TR('Desierto') },
    sea:       { res: null,    name: TR('Mar') }
  };
  const COST = {
    road:       { wood: 1, brick: 1 },
    settlement: { wood: 1, brick: 1, wheat: 1, wool: 1 },
    city:       { ore: 3, wheat: 2 },
    dev:        { ore: 1, wheat: 1, wool: 1 },
    ship:       { wood: 1, wool: 1 },
    lair:       { wool: 2, ore: 1 }
  };
  const DEV_NAME = { knight: TR('Caballero'), vp: TR('Punto de victoria'), roads: TR('Carreteras'), monopoly: TR('Monopolio'), plenty: TR('Abundancia') };
  const LIMITS = { road: 15, settlement: 5, city: 4, ship: 15 };
  // Extensiones: qué reglas activa cada modo de juego
  const MODES = {
    classic:    { name: TR('Clásico') },
    seafarers:  { name: TR('Navegantes'), ships: true, islands: true },
    pirates:    { name: TR('Piratas y exploradores'), ships: true, islands: true, fog: true, lairs: true },
    barbarians: { name: TR('Mercaderes y bárbaros'), harbor: true, barb: true }
  };
  const F = (G, k) => !!(MODES[G.mode] || MODES.classic)[k];
  const PLAYER_DEFS = [
    { name: TR('Tú'),      color: '#a8301f' },
    { name: TR('Aldric'),  color: '#27558f' },
    { name: TR('Isolda'),  color: '#c3922a' },
    { name: TR('Bertrán'), color: '#5f3a85' }
  ];

  const pips = n => (n ? 6 - Math.abs(7 - n) : 0);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const emptyRes = () => ({ wood: 0, brick: 0, wheat: 0, wool: 0, ore: 0 });
  const total = r => RES.reduce((s, k) => s + (r[k] || 0), 0);

  /* ---------- Generación del tablero ---------- */
  function genBoard(mode) {
    const M = MODES[mode] || MODES.classic, R = M.ships ? 3 : 2, SQ3 = Math.sqrt(3), hexes = [];
    for (let q = -R; q <= R; q++) for (let r = -R; r <= R; r++) {
      if (Math.abs(q + r) > R) continue;
      hexes.push({ id: hexes.length, q, r, x: SQ3 * (q + r / 2), z: 1.5 * r, terrain: null, num: 0, fog: false, lair: false, main: true, island: 0, verts: [], edges: [], nbrs: [] });
    }
    const byQR = new Map(hexes.map(h => [h.q + ',' + h.r, h]));
    const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
    hexes.forEach(h => { h.nbrs = DIRS.map(([dq, dr]) => byQR.get((h.q + dq) + ',' + (h.r + dr))).filter(Boolean).map(n => n.id); });
    let fogTokens = [];
    if (R === 2) {
      const bag = shuffle([...Array(4).fill('forest'), ...Array(3).fill('hills'), ...Array(3).fill('mountains'),
                           ...Array(4).fill('fields'), ...Array(4).fill('pasture'), 'desert']);
      hexes.forEach((h, i) => { h.terrain = bag[i]; });
    } else {
      // Mapa marítimo: isla principal al oeste y dos islas menores, giradas al azar
      const rot = (Math.random() * 6) | 0, turn = ([q, r]) => { for (let i = 0; i < rot; i++) [q, r] = [-r, q + r]; return q + ',' + r; };
      const MAIN = new Set([[0, 0], [1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1], [-2, 0], [-2, 1], [-2, 2], [-1, 2]].map(turn));
      const ISL = [[[3, -3], [3, -2], [2, -3]], [[3, 0], [2, 1], [1, 2], [0, 3]]].map(c => c.map(turn));
      const mainBag = shuffle([...Array(2).fill('forest'), ...Array(2).fill('hills'), ...Array(2).fill('mountains'), ...Array(2).fill('fields'), ...Array(2).fill('pasture'), 'desert']);
      const islBag = shuffle(['forest', 'forest', 'hills', 'fields', 'pasture', 'mountains', 'mountains']);
      hexes.forEach(h => { h.terrain = 'sea'; h.main = false; h.island = -1; });
      hexes.forEach(h => { if (MAIN.has(h.q + ',' + h.r)) { h.main = true; h.island = 0; h.terrain = mainBag.pop(); } });
      ISL.forEach((cells, i) => cells.forEach(k => { const h = byQR.get(k); h.island = i + 1; h.terrain = islBag.pop(); }));
      if (M.fog) hexes.forEach(h => { if (!h.main) h.fog = true; });
      if (M.lairs) {
        const cand = shuffle(hexes.filter(h => h.terrain === 'sea' && !h.nbrs.some(n => hexes[n].main)));
        cand.slice(0, 3).forEach(h => { h.lair = true; });
      }
    }

    // Vértices (esquinas compartidas) y aristas (lados compartidos)
    const verts = [], vmap = new Map(), edges = [], emap = new Map();
    hexes.forEach(h => {
      for (let i = 0; i < 6; i++) {
        const a = (60 * i - 30) * Math.PI / 180;
        const x = h.x + Math.cos(a), z = h.z + Math.sin(a);
        const key = Math.round(x * 100) + ',' + Math.round(z * 100);
        let v = vmap.get(key);
        if (!v) { v = { id: verts.length, x, z, hexes: [], edges: [], adj: [], building: null, port: -1 }; verts.push(v); vmap.set(key, v); }
        v.hexes.push(h.id); h.verts.push(v.id);
      }
      for (let i = 0; i < 6; i++) {
        const a = h.verts[i], b = h.verts[(i + 1) % 6], key = Math.min(a, b) + '-' + Math.max(a, b);
        let e = emap.get(key);
        if (!e) {
          e = { id: edges.length, v: [a, b], hexes: [], road: -1, kind: null, port: -1 };
          edges.push(e); emap.set(key, e);
          verts[a].edges.push(e.id); verts[b].edges.push(e.id);
          verts[a].adj.push(b); verts[b].adj.push(a);
        }
        e.hexes.push(h.id); h.edges.push(e.id);
      }
    });

    // Fichas numéricas: 6 y 8 nunca adyacentes. Las casillas ocultas reciben la suya al explorarlas
    const tokens = [2, 3, 3, 4, 4, 5, 5, 6, 6, 8, 8, 9, 9, 10, 10, 11, 11, 12];
    const numbered = hexes.filter(h => h.terrain !== 'sea' && h.terrain !== 'desert' && !h.fog);
    for (let tries = 0; tries < 2000; tries++) {
      shuffle(tokens); let i = 0;
      numbered.forEach(h => { h.num = tokens[i++]; });
      const hot = n => n === 6 || n === 8;
      if (!hexes.some(h => hot(h.num) && h.nbrs.some(n => hot(hexes[n].num)))) { fogTokens = tokens.slice(i); break; }
    }

    // Puertos: 9 sobre la costa de la isla principal, repartidos a lo largo del perímetro
    const isSea = h => hexes[h].terrain === 'sea';
    const coastE = R === 2 ? edges.filter(e => e.hexes.length === 1) : edges.filter(e => e.hexes.length === 2 && e.hexes.some(isSea) && e.hexes.some(h => hexes[h].main));
    const cx = R === 2 ? 0 : hexes.filter(h => h.main).reduce((a, h) => a + h.x, 0) / 11, cz = R === 2 ? 0 : hexes.filter(h => h.main).reduce((a, h) => a + h.z, 0) / 11;
    const coast = coastE.map(e => {
      const a = verts[e.v[0]], b = verts[e.v[1]];
      return { e, ang: Math.atan2((a.z + b.z) / 2 - cz, (a.x + b.x) / 2 - cx) };
    }).sort((p, q) => p.ang - q.ang);
    const offset = (Math.random() * coast.length) | 0;
    const picks = R === 2 ? [0, 3, 6, 10, 13, 16, 20, 23, 26] : Array.from({ length: 9 }, (_, i) => Math.round(i * coast.length / 9));
    const ptypes = shuffle(['any', 'any', 'any', 'any', 'wood', 'brick', 'wheat', 'wool', 'ore']);
    const ports = picks.map((p, i) => {
      const e = coast[(p + offset) % coast.length].e;
      const port = { id: i, type: ptypes[i], ratio: ptypes[i] === 'any' ? 3 : 2, edge: e.id, hex: e.hexes.find(h => !isSea(h)) };
      e.port = i; e.v.forEach(v => { verts[v].port = i; });
      return port;
    });
    const robber = hexes.find(h => h.terrain === 'desert').id;
    return { R, hexes, verts, edges, ports, robber, fogTokens };
  }

  // Niveles de IA: ruido en las decisiones, ganas de comerciar y astucia con el ladrón
  const AI_LEVELS = {
    easy:   { noise: 3.5, bank: 1, offers: 1, accept: -0.25, lead: 1, robberSmart: false, idle: 0.3, devPlay: 0.4, focusHuman: false, block: 0 },
    normal: { noise: 0.4, bank: 4, offers: 2, accept: 0.15, lead: 2, robberSmart: true, idle: 0, devPlay: 1, focusHuman: false, block: 0.5 },
    hard:   { noise: 0.08, bank: 6, offers: 3, accept: 0.45, lead: 3, robberSmart: true, idle: 0, devPlay: 1, focusHuman: true, block: 1 }
  };
  // Reconstruye una partida guardada (JSON) y le devuelve su nivel de IA
  const newStats = n => ({ rolls: Array(13).fill(0), gained: Array.from({ length: n }, emptyRes), hist: [] });
  function restore(data) {
    const G = data; G.ai = AI_LEVELS[G.difficulty] || AI_LEVELS.normal; if (!G.stats) G.stats = newStats(G.players.length);
    if (!G.mode) G.mode = 'classic'; G.pending = []; if (G.harborOwner == null) G.harborOwner = -1; if (!G.barb) G.barb = { track: 0, raided: [] };
    if (G.board.R == null) G.board.R = 2; if (!G.board.fogTokens) G.board.fogTokens = [];
    G.board.hexes.forEach(h => { if (h.main == null) h.main = true; if (h.island == null) h.island = 0; });
    G.players.forEach(p => { if (p.ships == null) p.ships = 0; if (p.bonusVP == null) p.bonusVP = 0; if (!p.home) p.home = []; if (!p.islands) p.islands = []; });
    return G;
  }
  const drain = G => { const ev = G.pending || []; G.pending = []; return ev; };
  function newGame(opts = {}) {
    const n = opts.players === 3 ? 3 : 4, target = Math.max(5, Math.min(15, opts.vp || 10));
    const difficulty = AI_LEVELS[opts.difficulty] ? opts.difficulty : 'normal', mode = MODES[opts.mode] ? opts.mode : 'classic';
    const board = genBoard(mode);
    const players = PLAYER_DEFS.slice(0, n).map((d, i) => ({
      id: i, name: d.name, color: d.color, isBot: i !== 0, res: emptyRes(), dev: [],
      knights: 0, settlements: 0, cities: 0, roads: 0, ships: 0, longest: 0, bonusVP: 0, home: [], islands: []
    }));
    const deck = shuffle([...Array(14).fill('knight'), ...Array(5).fill('vp'), 'roads', 'roads', 'monopoly', 'monopoly', 'plenty', 'plenty']);
    const first = (Math.random() * n) | 0;
    const order = players.map((_, i) => (first + i) % n);
    return {
      target, difficulty, ai: AI_LEVELS[difficulty], mode, pending: [], harborOwner: -1, barb: { track: 0, raided: [] },
      board, players, deck, phase: 'setup', setupOrder: [...order, ...order.slice().reverse()], setupIdx: 0,
      first, cur: order[0], turn: 0, rolled: false, devPlayed: false, longestOwner: -1, armyOwner: -1, winner: -1, lastRoll: null,
      stats: newStats(n)
    };
  }

  /* ---------- Reglas de colocación ---------- */
  const landHex = h => h.fog || h.terrain !== 'sea';                       // lo desconocido cuenta como tierra para los caminos
  const seaHex = h => h.fog || h.terrain === 'sea';                        // y como mar para los barcos
  function canSettle(G, pid, vid, setup) {

  function init(canvas) {
    canvasEl = canvas;
    renderer = new T.WebGLRenderer({ canvas, antialias: !MOBILE || devicePixelRatio < 2, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.6 : 2));
    renderer.outputEncoding = T.sRGBEncoding;
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
    renderer.shadowMap.autoUpdate = false;                       // las sombras se recalculan solo cuando algo se mueve
    anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

    scene = new T.Scene();
    scene.background = C('#120c07').convertLinearToSRGB();   // el color de borrado no pasa por la codificación sRGB
    scene.fog = new T.Fog(C('#120c07'), 28, 70);

    camera = new T.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
    controls = new T.OrbitControls(camera, canvas);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.minDistance = 6; controls.maxDistance = 38;
    controls.minPolarAngle = 0.12; controls.maxPolarAngle = 1.22;
    controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.9; controls.panSpeed = 0.7;
    controls.screenSpacePanning = false;
    controls.addEventListener('change', () => {
      const t = controls.target; t.x = Math.max(-7, Math.min(7, t.x)); t.z = Math.max(-6, Math.min(9, t.z)); t.y = 0;
    });

    buildDice();
    setTheme('medieval');
    scene.add(hlGroup);
    fitCamera(true);
    addEventListener('resize', () => { fitCamera(false); });
    setupPointer();
    clock = new T.Clock();
    renderer.setAnimationLoop(loop);
  }

    const Cn = []; for (let i = 0; i < N; i++) { const a = angleOff + i * 2 * Math.PI / N; Cn.push([Math.cos(a) * radius, Math.sin(a) * radius]); }

    push(0, 0, 0);

      for (let j = 0; j < k; j++) idx.push(id(k, s, j), id(k - 1, s, j), id(k, s, j + 1));
      for (let j = 0; j < k - 1; j++) idx.push(id(k - 1, s, j), id(k - 1, s, j + 1), id(k, s, j + 1));

    const P = i => new T.Vector3(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]);
    const n = new T.Vector3().subVectors(P(idx[1]), P(idx[0])).cross(new T.Vector3().subVectors(P(idx[2]), P(idx[0])));

    switch (t) {

        c: (x, z, y, e, o) => mix3(o, 0.35 + N2(x * 2, z * 2, b, a) * 0.6, e < 0.3 ? 0.4 : 0) };

  }

        for (let k = 0; k < pos.count; k++) {

          let u = ((px - o0[0]) * dir[0] + (pz - o0[1]) * dir[1]) / L;
          if (flip) u = 1 - u;
          const across = ((px * nr[0] + pz * nr[1]) - RI * AP) / PW;
          uv.setXY(k, u, Math.min(1, Math.max(0, across)) + (py < 0.25 ? py * 0.9 : 0));   // los cantos continúan la veta
        }
        const tex = planks[i % 3];
        const mat = std({ map: tex.map, bumpMap: tex.bump, bumpScale: 0.012, roughness: 0.46, color: new T.Color(1, 1, 1).offsetHSL(0, 0, (i % 3 - 1) * 0.04) });
        const plank = new T.Mesh(g, mat); plank.position.y = TABLE_Y + 0.24; plank.castShadow = plank.receiveShadow = true;
        boardGroup.add(plank);
        // Herraje de hierro en la esquina, sobre el inglete
        const kite = new T.Shape(); kite.moveTo(0.5, 0); kite.lineTo(0, 0.3); kite.lineTo(-0.34, 0); kite.lineTo(0, -0.3); kite.closePath();
        const kg = new T.ExtrudeGeometry(kite, { depth: 0.025, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.012, bevelSegments: 1 }); kg.rotateX(-Math.PI / 2);
        const plate = new T.Mesh(kg, ironMat()); const cr = (RO + RI) / 2 + 0.06;
        plate.position.set(Math.cos(a0) * cr, TABLE_Y + 0.24 + 0.296, Math.sin(a0) * cr); plate.rotation.y = -a0; plate.castShadow = true; plate.receiveShadow = true;
        boardGroup.add(plate);
        [[0.3, 0], [0, 0.15], [0, -0.15], [-0.18, 0]].forEach(([rx, rz]) => {
          const rv = new T.Mesh(new T.SphereGeometry(0.032, 10, 6), brass()); rv.scale.y = 0.6;
          const ca = Math.cos(a0), sa = Math.sin(a0);
          rv.position.set(plate.position.x + rx * ca - rz * sa, plate.position.y + 0.035, plate.position.z + rx * sa + rz * ca);
          boardGroup.add(rv);
        });
      }
    }

    // Mar con oleaje (desplazamiento + normales analíticas en el vertex shader)
    let water;
    if (TH.moon) {
      const hs = new T.Shape(); for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; i ? hs.lineTo(Math.cos(a) * 6.45, Math.sin(a) * 6.45) : hs.moveTo(Math.cos(a) * 6.45, Math.sin(a) * 6.45); } hs.closePath();
      const mg = new T.ShapeGeometry(hs); mg.rotateX(-Math.PI / 2);
      const mt = texFrom(regolithCanvas(131, 58, 1024, 110), true, [0.2, 0.2]), mb = texFrom(regolithCanvas(131, 58, 1024, 110), false, [0.2, 0.2]);
      water = new T.Mesh(mg, std({ map: mt, bumpMap: mb, bumpScale: 0.04, roughness: 0.97, envMapIntensity: 0.25 }));
      water.position.y = WATER_Y - 0.01; water.receiveShadow = true;
    } else {
    water = new T.Mesh(POM() ? hexCap(6.95, 56, -Math.PI / 2, null, null, 5) : hexCap(6.45, 56, 0, null, null), std({ color: C(TH.water.color), roughness: TH.water.rough, metalness: TH.water.metal, emissive: C(TH.water.emissive), envMapIntensity: 1.0 }));
    water.position.y = WATER_Y; water.receiveShadow = true;
    water.material.onBeforeCompile = sh => {
      sh.uniforms.uTime = uTime;
      sh.vertexShader = `uniform float uTime;
        vec3 waveH(vec2 p){
          vec3 r = vec3(0.0); vec2 d; float f, a, s, ph;
          d = normalize(vec2(1.0,0.6));  f=1.7; a=0.020; s=1.1; ph=dot(d,p)*f+uTime*s; r.x+=a*sin(ph); r.yz+=a*f*cos(ph)*d;
          d = normalize(vec2(-0.7,1.0)); f=2.7; a=0.012; s=1.6; ph=dot(d,p)*f+uTime*s; r.x+=a*sin(ph); r.yz+=a*f*cos(ph)*d;
          d = normalize(vec2(0.3,-1.0)); f=4.4; a=0.006; s=2.3; ph=dot(d,p)*f+uTime*s; r.x+=a*sin(ph); r.yz+=a*f*cos(ph)*d;
          d = normalize(vec2(-1.0,-0.4));f=7.3; a=0.003; s=3.2; ph=dot(d,p)*f+uTime*s; r.x+=a*sin(ph); r.yz+=a*f*cos(ph)*d;
          return r;
        }
        varying float vFoam;
        ` + sh.vertexShader
        .replace('#include <beginnormal_vertex>', 'vec3 wvH = waveH(position.xz); vec3 objectNormal = normalize(vec3(-wvH.y, 1.0, -wvH.z));')
        .replace('#include <begin_vertex>', 'vec3 transformed = vec3(position); transformed.y += wvH.x; vFoam = smoothstep(0.012, 0.03, wvH.x);');
      sh.fragmentShader = 'varying float vFoam;\n' + sh.fragmentShader
        .replace('#include <color_fragment>', '#include <color_fragment>\n diffuseColor.rgb = mix(diffuseColor.rgb, vec3(' + TH.water.foam + '), vFoam*' + (FUT() ? '0.25' : '0.35') + ');');
    };
    }
    boardGroup.add(water);
    BS = B.R === 3 || POM() ? 0.86 : 1;
    mapGroup = new T.Group(); mapGroup.scale.setScalar(BS); boardGroup.add(mapGroup);
    piecesGroup.scale.setScalar(BS); fxGroup.scale.setScalar(BS); hlGroup.scale.setScalar(BS);
    for (const k in lairAt) delete lairAt[k]; for (const k in raidAt) delete raidAt[k];

    // Fichas de terreno
    const sideMat = FUT() ? std({ color: C('#6e7076'), metalness: 0.1, roughness: 0.85, envMapIntensity: 0.6 }) : std({ map: texFrom(planksCanvas(51), true, [0.5, 3]), color: C('#c9a789'), roughness: 0.7 });
    const outline = false ? (() => { const pts = []; for (let i = 0; i <= 6; i++) { const a = (60 * i - 30) * Math.PI / 180; pts.push(new T.Vector3(Math.cos(a) * 0.95, 0, Math.sin(a) * 0.95)); } return new T.BufferGeometry().setFromPoints(pts); })() : null;
    const outlineM = FUT() ? new T.LineBasicMaterial({ color: C('#ffffff'), transparent: true, opacity: 0.55 }) : null;
    const tileShape = (() => { const s = new T.Shape(), R = 0.9; for (let i = 0; i < 6; i++) { const a = (60 * i - 30) * Math.PI / 180; const px = Math.cos(a) * R, py = -Math.sin(a) * R; i ? s.lineTo(px, py) : s.moveTo(px, py); } s.closePath(); return s; })();
    const tileGeo = new T.ExtrudeGeometry(tileShape, { depth: 0.1, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.05, bevelSegments: 2 });
    tileGeo.rotateX(-Math.PI / 2);
    const capMat = std({ vertexColors: true, roughness: FUT() ? 0.8 : 0.92, metalness: 0, flatShading: true, envMapIntensity: 0.4 });
    const deco = { trunks: [], pines: [], rounds: [], wheat: [], tufts: [], sheep: [], heads: [], legs: [], bricks: [], rocks: [], pits: [], cacti: [], peaks: [] };
    const tm = new T.Matrix4(), tq = new T.Quaternion(), tsc = new T.Vector3(), tp = new T.Vector3(), up = new T.Vector3(0, 1, 0);
    const M = (x, y, z, s = 1, ry = 0, sx, sy, sz) => { tq.setFromAxisAngle(up, ry); tsc.set(sx ?? s, sy ?? s, sz ?? s); tp.set(x, y, z); return new T.Matrix4().compose(tp, tq, tsc); };

    let millDone = false;
    B.hexes.forEach(h => {
      const r = rng(h.id * 7919 + 13), fa = r() * 10, fb = r() * 10;
      const mark = {}; for (const k in deco) mark[k] = deco[k].length;
      if (h.terrain === 'sea' && !h.fog) { if (h.lair) addLair(h); return; }
      if (h.fog) { addFogTile(h, tileGeo, sideMat); return; }
      const F = terrainFns(h.terrain, fa, fb);
      const body = new T.Mesh(tileGeo, [std({ color: PALC[h.terrain][0], roughness: 0.9 }), sideMat]);
      body.position.set(h.x, 0, h.z); body.castShadow = true; body.receiveShadow = true;
      mapGroup.add(body);
      if (outline) { const ol = new T.Line(outline, outlineM); ol.position.set(h.x, TILE_TOP + 0.045, h.z); mapGroup.add(ol); }
      const cap = new T.Mesh(hexCap(0.9, 12, -Math.PI / 6, F.h, F.c), capMat);
      cap.position.set(h.x, TILE_TOP + 0.002, h.z); cap.receiveShadow = true; cap.castShadow = true;
      mapGroup.add(cap);
      h._hf = F.h;
      const surf = (lx, lz) => TILE_TOP + F.h(lx, lz, hexDist(lx, lz, 0.9));
      // Muestreo de posiciones dentro del hexágono, lejos de la ficha central
      const scatter = (n, minD, eMin, eMax) => {
        const out = [];
        for (let tries = 0; tries < n * 40 && out.length < n; tries++) {
          const lx = (r() * 2 - 1) * 0.85, lz = (r() * 2 - 1) * 0.85, e = hexDist(lx, lz, 0.9);
          if (e < eMin || e > eMax) continue;
          if (out.some(p => Math.hypot(p[0] - lx, p[1] - lz) < minD)) continue;
          out.push([lx, lz]);
        }
        return out;
      };
      const tint = (base, j) => C(base).offsetHSL((r() - 0.5) * 0.04, (r() - 0.5) * 0.15, (r() - 0.5) * j);
      switch (h.terrain) {
        case 'forest':
          scatter(19, 0.145, 0.42, 0.88).forEach(([lx, lz]) => {
            const s = 0.75 + r() * 0.55, y = surf(lx, lz), wx = h.x + lx, wz = h.z + lz, ry = r() * 6.3;
            deco.trunks.push([M(wx, y, wz, s, ry), tint(TH.deco.trunk, 0.08)]);
            if (r() < 0.68) deco.pines.push([M(wx, y, wz, s, ry), tint(r() < 0.5 ? TH.deco.pineA : TH.deco.pineB, 0.1)]);
            else deco.rounds.push([M(wx, y, wz, s * 1.05, ry), tint(r() < 0.5 ? TH.deco.roundA : TH.deco.roundB, 0.1)]);
          });
          break;
        case 'hills': {
          const pits = scatter(2, 0.42, 0.48, 0.72);
          pits.forEach(([lx, lz]) => {
            const y = surf(lx, lz);
            deco.pits.push([M(h.x + lx, y - 0.012, h.z + lz, 1, r() * 3), tint(TH.deco.pit, 0.06)]);
            for (let k = 0; k < 4; k++) {
              const bx = lx + 0.13 + (k % 2) * 0.065, bz = lz + 0.05, by = surf(bx, bz) + 0.013 + Math.floor(k / 2) * 0.027;
              deco.bricks.push([M(h.x + bx, by, h.z + bz, 1, 0.3), tint(TH.deco.brick, 0.1)]);
            }
          });
          scatter(5, 0.15, 0.45, 0.85).forEach(([lx, lz]) => {
            if (pits.some(p => Math.hypot(p[0] - lx, p[1] - lz) < 0.22)) return;
            deco.rounds.push([M(h.x + lx, surf(lx, lz) - 0.05, h.z + lz, 0.55, r() * 6), tint(TH.deco.shrub, 0.1)]);
          });
          break;
        }
        case 'mountains': {
          const spots = scatter(3, 0.42, 0.44, 0.62);
          spots.forEach(([lx, lz], i) => {
            const pr = 0.22 + r() * 0.08 - i * 0.02, ph = 0.38 + r() * 0.22 - i * 0.06;
            deco.peaks.push(peakGeo(pr, ph, h.id * 31 + i, h.x + lx, surf(lx, lz) - 0.01, h.z + lz));
          });
          scatter(4, 0.14, 0.5, 0.85).forEach(([lx, lz]) => {
            if (spots.some(p => Math.hypot(p[0] - lx, p[1] - lz) < 0.26)) return;
            deco.rocks.push([M(h.x + lx, surf(lx, lz) + 0.01, h.z + lz, 0.6 + r() * 0.6, r() * 6), tint(TH.deco.rock, 0.1)]);
          });
          break;
        }
        case 'fields': {
          const step = MOBILE ? 0.085 : 0.068;
          let mill = null;
          if (!millDone) {
            millDone = true; const a = -0.5 + r() * 0.6; mill = [Math.cos(a) * 0.58, Math.sin(a) * 0.58 - 0.1];
            const wm = makeWindmill(); wm.position.set(h.x + mill[0], surf(mill[0], mill[1]), h.z + mill[1]); mapGroup.add(wm);
          }
          for (let gx = -0.82; gx <= 0.82; gx += step) for (let gz = -0.82; gz <= 0.82; gz += step * 0.85) {
            const lx = gx + (r() - 0.5) * 0.025, lz = gz + (r() - 0.5) * 0.025, e = hexDist(lx, lz, 0.9);
            if (e < 0.42 || e > 0.88) continue;
            if (mill && Math.hypot(lx - mill[0], lz - mill[1]) < 0.15) continue;
            deco.wheat.push([M(h.x + lx, surf(lx, lz), h.z + lz, 0.8 + r() * 0.45), tint(r() < 0.5 ? TH.deco.wheatA : TH.deco.wheatB, 0.12)]);
          }
          break;
        }
        case 'pasture': {
          {                                                         // cerca de madera
            const a0 = r() * 6.28, R = 0.66, n = 7, pts = [];
            for (let i = 0; i < n; i++) { const a = a0 + i * 0.16; pts.push([Math.cos(a) * R, Math.sin(a) * R]); }
            const gs = [];
            pts.forEach(([lx, lz]) => { const pg = new T.BoxGeometry(0.014, 0.07, 0.014); pg.translate(h.x + lx, surf(lx, lz) + 0.03, h.z + lz); gs.push(pg); });
            for (let i = 0; i < n - 1; i++) {
              const [ax, az] = pts[i], [bx, bz] = pts[i + 1], len = Math.hypot(bx - ax, bz - az), yy = (surf(ax, az) + surf(bx, bz)) / 2;
              [0.028, 0.052].forEach(hh => { const rg = new T.BoxGeometry(len + 0.01, 0.008, 0.006); rg.rotateY(-Math.atan2(bz - az, bx - ax)); rg.translate(h.x + (ax + bx) / 2, yy + hh, h.z + (az + bz) / 2); gs.push(rg); });
            }
            const fence = new T.Mesh(merge(gs), sharedMats().wood); fence.castShadow = fence.receiveShadow = true; mapGroup.add(fence);
          }
          scatter(MOBILE ? 35 : 55, 0.07, 0.4, 0.9).forEach(([lx, lz]) => deco.tufts.push([M(h.x + lx, surf(lx, lz), h.z + lz, 0.7 + r() * 0.7, r() * 6), tint(TH.deco.tuft, 0.14)]));
          scatter(3, 0.3, 0.45, 0.78).forEach(([lx, lz]) => {
            const ry = r() * 6.3, y = surf(lx, lz), bm = M(h.x + lx, y + 0.075, h.z + lz, 1, ry);
            deco.sheep.push([bm, tint(TH.deco.sheep, 0.05)]);
            deco.heads.push([bm.clone().multiply(new T.Matrix4().makeTranslation(0.085, 0.015, 0)), C(TH.deco.head)]);
            [[0.04, 0.03], [0.04, -0.03], [-0.04, 0.03], [-0.04, -0.03]].forEach(([ox, oz]) => deco.legs.push([bm.clone().multiply(new T.Matrix4().makeTranslation(ox, -0.045, oz)), C(TH.deco.head)]));
          });
          break;
        }
        default:
          scatter(3, 0.25, 0.48, 0.85).forEach(([lx, lz]) => deco.rocks.push([M(h.x + lx, surf(lx, lz) + 0.005, h.z + lz, 0.5 + r() * 0.5, r() * 6), tint(TH.deco.dRock, 0.1)]));
          scatter(3, 0.11, 0.5, 0.72).forEach(([lx, lz], i) => {        // ruinas de columnas
            const ch = [0.2, 0.12, 0.07][i];
            part(boardGroup, new T.CylinderGeometry(0.028, 0.032, ch, 10), sharedMats().stone, h.x + lx, surf(lx, lz) + ch / 2, h.z + lz).rotation.z = (r() - 0.5) * 0.1;
          });
          scatter(1, 0.3, 0.55, 0.8).forEach(([lx, lz]) => { part(boardGroup, new T.BoxGeometry(0.15, 0.035, 0.045), sharedMats().stone, h.x + lx, surf(lx, lz) + 0.016, h.z + lz).rotation.y = r() * 3; });
      }
      for (const k in deco) for (let i = mark[k]; i < deco[k].length; i++) { const it = deco[k][i]; if (Array.isArray(it)) { it[2] = h.id; it[3] = k === 'legs' ? (i - mark[k]) >> 2 : i - mark[k]; } }
      // Ficha numérica (disco de madera)
      if (h.num) addToken(h);
    });

    // Geometrías de decoración instanciadas (pocas llamadas de dibujo)
    const trunkG = new T.CylinderGeometry(0.022, 0.032, 0.11, 5); trunkG.translate(0, 0.055, 0);
    const c1 = new T.ConeGeometry(0.115, 0.2, 7); c1.translate(0, 0.17, 0);
    const c2 = new T.ConeGeometry(0.085, 0.17, 7); c2.translate(0, 0.27, 0);
    const pineG = merge([c1, c2]);
    const roundG = new T.IcosahedronGeometry(0.1, 0); roundG.translate(0, 0.17, 0);
    const stalk = new T.CylinderGeometry(0.005, 0.008, 0.15, 4); stalk.translate(0, 0.075, 0);
    const ear = new T.CylinderGeometry(0.013, 0.009, 0.06, 5); ear.translate(0, 0.175, 0);
    const wheatG = merge([stalk, ear]);
    const tuftG = new T.ConeGeometry(0.02, 0.07, 4); tuftG.translate(0, 0.03, 0);
    const sheepG = new T.SphereGeometry(0.055, 10, 8); sheepG.scale(1.35, 0.95, 1);
    const headG = new T.BoxGeometry(0.045, 0.045, 0.04);
    const legG = new T.CylinderGeometry(0.008, 0.008, 0.05, 4);
    const brickG = new T.BoxGeometry(0.058, 0.025, 0.03);
    const rockG = new T.DodecahedronGeometry(0.05, 0); rockG.scale(1, 0.7, 1);
    const pitG = new T.CylinderGeometry(0.12, 0.09, 0.03, 12);
    const cactG = (() => { const a = new T.CylinderGeometry(0.022, 0.026, 0.16, 6); a.translate(0, 0.08, 0); const b = new T.CylinderGeometry(0.014, 0.014, 0.07, 5); b.translate(0.04, 0.1, 0); const c = new T.CylinderGeometry(0.013, 0.013, 0.06, 5); c.translate(-0.035, 0.08, 0); return merge([a, b, c]); })();

    const flat = { flatShading: true };
    for (const k in hexInst) delete hexInst[k];
    const inst = (geo, list, mat, cast = true, kind = null) => {
      if (!list.length) return null;
      const m = new T.InstancedMesh(geo, mat, list.length);
      list.forEach(([mx, col, hid, ph], i) => {
        m.setMatrixAt(i, mx); m.setColorAt(i, col);
        if (kind && hid != null) (hexInst[hid] = hexInst[hid] || []).push({ mesh: m, i, base: mx, kind, ph });
      });
      m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true;
      m.castShadow = cast; m.receiveShadow = true;
      mapGroup.add(m); return m;
    };
    inst(trunkG, deco.trunks, std({ roughness: 0.9 }), true, 'tree');
    inst(pineG, deco.pines, std(Object.assign({ roughness: 0.85 }, flat, em('forest'))), true, 'tree');
    inst(roundG, deco.rounds, std(Object.assign({ roughness: 0.85 }, flat, em('forest'))), true, 'tree');
    const wheatMat = std(Object.assign({ roughness: 0.75 }, em('wheat')));
    wheatMat.onBeforeCompile = sh => {
      sh.uniforms.uTime = uTime;
      sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
        #ifdef USE_INSTANCING
          vec3 ip = instanceMatrix[3].xyz;
          float k = clamp(position.y / 0.205, 0.0, 1.0); k *= k;
          float gust = sin(uTime * 1.6 + ip.x * 1.2 + ip.z * 0.8) * 0.6 + sin(uTime * 3.4 + ip.x * 4.1 - ip.z * 2.9) * 0.25 + 0.35;
          transformed.x += gust * 0.05 * k; transformed.z += gust * 0.02 * k;
        #endif`);
    };
    inst(wheatG, deco.wheat, wheatMat);
    inst(tuftG, deco.tufts, std(Object.assign({ roughness: 0.95 }, flat, em('tuft'))), false);
    inst(sheepG, deco.sheep, std(Object.assign({ roughness: FUT() ? 0.6 : 1, metalness: 0 }, em('sheep'))), true, 'sheep');
    inst(headG, deco.heads, std({ roughness: 0.8 }), true, 'sheep');
    inst(legG, deco.legs, std({ roughness: 0.8 }), false, 'sheep');
    inst(brickG, deco.bricks, std(Object.assign({ roughness: 0.85 }, em('brick'))));
    inst(rockG, deco.rocks, std(Object.assign({ roughness: 0.9 }, flat)));
    inst(pitG, deco.pits, std({ roughness: 1 }), false);
    inst(cactG, deco.cacti, std(Object.assign({ roughness: 0.8 }, flat)));
    if (deco.peaks.length) {
      const pm = new T.Mesh(merge(deco.peaks), std({ vertexColors: true, roughness: FUT() ? 0.35 : 0.88, metalness: 0, flatShading: true, emissive: C('#000000') }));
      pm.castShadow = pm.receiveShadow = true; mapGroup.add(pm);
    }

    B.ports.forEach(pt => addPort(pt, oak));

    // Ladrón
    robberMesh = makeRobber();
    piecesGroup.add(robberMesh);
    placeRobber(B.robber, false);
    markShadows(3);
  }

  // Pico rocoso irregular con nieve en la cima (colores por vértice)
  function peakGeo(r, h, seed, x, y, z) {
    const rnd = rng(seed), g = new T.ConeGeometry(r, h, 8, 5, false);
    g.translate(0, h / 2, 0);
    const p = g.attributes.position, cols = [], cache = new Map();
    const rock = C(TH.peak[0]), rock2 = C(TH.peak[1]), snow = C(TH.peak[2]), tmp = new T.Color();
    for (let i = 0; i < p.count; i++) {
      const vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i), key = `${vx.toFixed(3)},${vy.toFixed(3)},${vz.toFixed(3)}`;
      let o = cache.get(key);
      if (!o) { o = [(rnd() - 0.5) * r * 0.45, (rnd() - 0.5) * h * 0.12, (rnd() - 0.5) * r * 0.45]; cache.set(key, o); }
      const t = vy / h, keepBase = vy < 0.001 ? 0 : 1;
      p.setXYZ(i, vx + o[0] * (1 - t * 0.6), vy + o[1] * keepBase * (t < 0.98 ? 1 : 0.3), vz + o[2] * (1 - t * 0.6));
      const nt = p.getY(i) / h;
      if (nt > 0.6 + o[1] * 2) tmp.copy(snow); else tmp.copy(rock).lerp(rock2, Math.min(1, nt * 1.4 + o[0] * 2));
      cols.push(tmp.r, tmp.g, tmp.b);
    }
    g.setAttribute('color', new T.Float32BufferAttribute(cols, 3));
    g.deleteAttribute('uv');
    g.computeVertexNormals();
    g.translate(x, y, z);
    return g;
  }

  // Los árboles se cimbrean y las ovejas brincan en la casilla que produce

  /* ---------- trabajadores que recogen el recurso en la casilla que produce ----------
     Medieval: aldeanos con hacha, pico, pala, hoz o tijeras, y un porteador con el saco.
     Futurista: robots flotantes con haz tractor, taladros de pulsos y una cápsula de carga. */
  let wkM = null;
  function workerMats() {
    if (wkM && wkM.key === TH.key) return wkM;
    return (wkM = { key: TH.key,
      skin: std({ color: C('#d9a77f'), roughness: 0.8 }),
      tunic: ['#b8352a', '#2e6fb5', '#d39a1b', '#7d4aa8'].map(c => std({ color: C(c), roughness: 0.95 })),

  const WK_TOOL = { forest: 'axe', mountains: 'pick', hills: 'shovel', fields: 'scythe', pasture: 'shears' };
  // Aldeano: piernas, túnica, cabeza con sombrero y un brazo articulado en el hombro que sujeta la herramienta
  function makePeasant(tool, ti) {
    const M = workerMats(), g = new T.Group(), body = new T.Group(); g.add(body);
    [-0.007, 0.007].forEach(x => part(body, new T.CylinderGeometry(0.0055, 0.0055, 0.03, 6), M.leg, x, 0.015, 0));
    part(body, new T.CylinderGeometry(0.011, 0.016, 0.042, 8), M.tunic[ti % 4], 0, 0.05, 0);
    part(body, new T.SphereGeometry(0.011, 10, 8), M.skin, 0, 0.082, 0);
    part(body, new T.CylinderGeometry(0.017, 0.017, 0.003, 12), M.hat, 0, 0.09, 0);
    part(body, new T.ConeGeometry(0.009, 0.012, 10), M.hat, 0, 0.097, 0);
    part(body, new T.CylinderGeometry(0.004, 0.004, 0.026, 5), M.tunic[ti % 4], -0.014, 0.058, 0).rotation.z = 0.15;
    const arm = new T.Group(); arm.position.set(0.013, 0.066, 0); body.add(arm);
    part(arm, new T.CylinderGeometry(0.004, 0.004, 0.028, 5), M.tunic[ti % 4], 0, -0.014, 0);
    part(arm, new T.SphereGeometry(0.0045, 6, 5), M.skin, 0, -0.029, 0);
    const len = tool === 'scythe' ? 0.085 : tool === 'shears' ? 0.012 : 0.06;
    if (tool !== 'shears') part(arm, new T.CylinderGeometry(0.0022, 0.0022, len, 5), M.handle, 0, -0.029 - len / 2, 0);
    const tip = -0.029 - len;

    if (tool === 'pick') part(arm, new T.BoxGeometry(0.004, 0.005, 0.036), M.iron, 0, tip + 0.002, 0.004);
    if (tool === 'shovel') part(arm, new T.BoxGeometry(0.016, 0.02, 0.003), M.iron, 0, tip - 0.006, 0.002);
    if (tool === 'scythe') { const b = part(arm, new T.BoxGeometry(0.004, 0.003, 0.045), M.iron, 0, tip + 0.002, 0.02); b.rotation.x = 0.25; }
    if (tool === 'shears') part(arm, new T.BoxGeometry(0.003, 0.016, 0.006), M.iron, 0, tip - 0.008, 0.002);
    return { g, body, arm, tool };
  }
  function makePorter(col, ti) {
    const p = makePeasant('none', ti), M = workerMats();
    part(p.body, new T.SphereGeometry(0.016, 10, 8), M.sack, 0, 0.068, -0.016).scale.set(1, 1.1, 0.8);
    part(p.body, new T.BoxGeometry(0.014, 0.01, 0.01), std({ color: C(col), roughness: 0.8 }), 0, 0.086, -0.016);

  }
  // Robot flotante: cuerpo cápsula, visor, anillo propulsor; con haz tractor o taladro de pulsos
  function makeBot(col, drill) {
    const M = workerMats(), g = new T.Group(), body = new T.Group(); g.add(body);
    const accent = std({ color: C(col), roughness: 0.4, emissive: C(col), emissiveIntensity: 0.35 });
    part(body, new T.SphereGeometry(0.022, 16, 12), M.joint, 0, 0, 0).scale.set(1, 0.85, 1);
    part(body, new T.SphereGeometry(0.0225, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2.6), M.shell, 0, 0.001, 0);
    part(body, new T.BoxGeometry(0.03, 0.009, 0.012), M.visor, 0, -0.002, 0.016);
    part(body, new T.BoxGeometry(0.02, 0.002, 0.002), accent, 0, -0.002, 0.0225);
    const ring = part(body, new T.TorusGeometry(0.02, 0.003, 6, 20), accent, 0, -0.014, 0); ring.rotation.x = Math.PI / 2;
    let tool;
    if (drill) {
      part(body, new T.CylinderGeometry(0.004, 0.004, 0.02, 6), M.joint, 0, -0.026, 0);
      tool = part(body, new T.ConeGeometry(0.009, 0.026, 8), M.joint, 0, -0.048, 0); tool.rotation.x = Math.PI;
    } else {
      const h = 0.11;
      tool = new T.Mesh(new T.CylinderGeometry(0.006, 0.045, h, 20, 1, true), new T.MeshBasicMaterial({ color: C(col), transparent: true, opacity: 0.4, depthWrite: false, side: T.DoubleSide }));

  }
  function makePulse(col) {
    const m = new T.Mesh(new T.RingGeometry(0.05, 0.062, 32), new T.MeshBasicMaterial({ color: C(col), transparent: true, opacity: 0, depthWrite: false, side: T.DoubleSide }));
    m.rotation.x = -Math.PI / 2; return m;
  }
  function workers(h, dur = 2700) {
    const t = h.terrain, tool = WK_TOOL[t]; if (!tool) return Promise.resolve();
    const col = TH.burst[t][0], fut = FUT(), S = 2.5, BEAM = '#1f86ff';   // el haz y los pulsos en azul vivo para destacar sobre cualquier terreno
    const grp = new T.Group(); fxGroup.add(grp);
    const a0 = Math.random() * 6.283, crew = [], disp = [];
    const gy = (lx, lz) => TILE_TOP + 0.004 + (h._hf ? h._hf(lx, lz, hexDist(lx, lz, 0.9)) : 0);   // altura real del relieve
    const spot = (a, r) => { const lx = Math.cos(a) * r, lz = Math.sin(a) * r; return new T.Vector3(h.x + lx, gy(lx, lz), h.z + lz); };
    const face = (o, a) => { o.rotation.y = Math.atan2(Math.cos(a), Math.sin(a)); };  // mira hacia fuera de la ficha
    const nWork = MOBILE ? 2 : 3;
    for (let i = 0; i < nWork; i++) {
      const a = a0 + i * (6.283 / (nWork + 1)) + (Math.random() - 0.5) * 0.3, r = 0.44 + Math.random() * 0.08, p = spot(a, r);
      const w = fut ? makeBot(BEAM, t === 'hills' || t === 'mountains') : makePeasant(tool, i);
      w.g.position.copy(p); face(w.g, a); w.g.scale.setScalar(0.001); w.ph = Math.random() * 6; w.a = a; w.r = r;
      if (fut) {
        w.hov = (w.drill ? 0.058 : 0.126) * S; w.g.position.y = p.y + w.hov;
        w.pulses = [0, 1].map(() => { const m = makePulse(BEAM); m.position.set(p.x, p.y + 0.004, p.z); grp.add(m); disp.push(m.material, m.geometry); return m; });
        w.bits = w.drill ? [] : [0, 1, 2].map(() => { const m = new T.Mesh(new T.BoxGeometry(0.014, 0.014, 0.014), std({ color: C(col), roughness: 0.6 })); grp.add(m); disp.push(m.material, m.geometry); return m; });
        disp.push(w.accent); if (!w.drill) disp.push(w.tool.material);
      }
      grp.add(w.g); crew.push(w);
    }
    // Porteador (o cápsula de carga) que se lleva lo recogido
    const pa = a0 + 6.283 * nWork / (nWork + 1);
    let carrier;
    if (fut) {
      const M = workerMats(), g = new T.Group(), crate = std({ color: C(col), roughness: 0.5 });

      part(g, new T.BoxGeometry(0.028, 0.022, 0.024), crate, 0, 0.019, 0);
      [-1, 1].forEach(s => { const r = part(g, new T.TorusGeometry(0.009, 0.003, 6, 14), M.joint, s * 0.03, -0.004, 0); r.rotation.x = Math.PI / 2; });

          } else if (w.tool === 'scythe') {
            w.arm.rotation.x = -1.15; w.body.rotation.y = Math.sin(s * 3) * 0.75;
          } else {

          w.bits.forEach((m, q) => {
            const f = (s * 0.8 + q / 3) % 1;

  function robberPuff(hid) { const p = robberSpot(hid); puff(p, { n: 14, r: 0.45, color: TH.dustDark }); pulseHexes([hid], FUT() ? '#ff4a3d' : '#ff6a3d'); }

  /* ---------- piezas de jugador ---------- */
  function vpos(vid) { const v = board.verts[vid]; return new T.Vector3(v.x, TILE_TOP + 0.005, v.z); }
  function addRoad(eid, pid, anim = true) {
    const e = board.edges[eid], a = board.verts[e.v[0]], b = board.verts[e.v[1]];
    const k = getGeos(); if (!k.tube) { k.tube = new T.CylinderGeometry(0.036, 0.036, 0.54, 14); k.tube.rotateZ(Math.PI / 2); }
    const m = new T.Mesh(FUT() ? k.tube : k.road, pmats(pid).road);
    m.position.set((a.x + b.x) / 2, TILE_TOP + (FUT() ? 0.036 : 0.024), (a.z + b.z) / 2);
    m.rotation.y = -Math.atan2(b.z - a.z, b.x - a.x);

  function addSettlement(vid, pid, anim = true) {

  async function upgradeCity(vid, pid, anim = true) {

  function robberSpot(hid) { const h = board.hexes[hid]; return new T.Vector3(h.x + 0.02, TILE_TOP + 0.01, h.z - 0.36); }

  // Destello cálido sobre las casillas que producen

        .then(() => { fxGroup.remove(m); m.material.dispose(); });
